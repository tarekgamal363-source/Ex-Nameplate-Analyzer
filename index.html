<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08142F">
<title>Ex Nameplate Analyzer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700;1,800&family=Barlow:wght@400;500;600;700&family=Cairo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout concept: one phone-width column. Hazard-stripe frame around a steel control panel on the home screen; navy pages with yellow signal accents for results and lessons. */
:root {
  --bg: #08142F;
  --navy: #0B1B3F;
  --card: #13295C;
  --card-hi: #1A3470;
  --line: #27468A;
  --yellow: #F5C518;
  --yellow-deep: #D9A900;
  --ink: #0B1B3F;
  --text: #FFFFFF;
  --muted: #B9C6E4;
  --steel: #C3CBD6;
  --steel-deep: #9AA5B4;
  --pale: #CFE2F7;
  --tile: #DCE9F8;
  --danger: #FF8A7E;
  --ok: #5BD6A0;
  --font-d: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --font-b: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-ar: 'Cairo', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --font-m: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-b);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-text-size-adjust: 100%;
}
html[dir="rtl"] body { font-family: var(--font-ar); line-height: 1.7; }
#app { max-width: 520px; margin: 0 auto; padding-block: 12px 28px; min-width: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 3px solid var(--yellow); outline-offset: 2px;
}
h1, h2, h3, p { margin: 0; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.mono { font-family: var(--font-m); }
svg { max-width: 100%; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 12px; }
.back { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 8px 4px; min-height: 44px; color: var(--yellow); font-family: var(--font-d); font-size: 22px; font-weight: 600; letter-spacing: .3px; }
html[dir="rtl"] .back { font-family: var(--font-ar); font-size: 18px; }
.back svg { width: 22px; height: 22px; }
html[dir="rtl"] .back svg { transform: scaleX(-1); }
.lang { display: inline-flex; border: 2px solid var(--yellow); border-radius: 18px; overflow: hidden; background: var(--navy); flex: none; }
.lang button { background: transparent; border: 0; padding: 6px 14px; min-height: 38px; font-size: 14px; font-weight: 600; color: #fff; font-family: var(--font-b); }
.lang button.on { background: var(--yellow); color: var(--ink); }
.lang button[data-l="ar"] { font-family: var(--font-ar); }

/* hero */
.hero { position: relative; border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #0C2250 0%, #12326F 55%, #0B1B3F 100%); padding: 18px 16px 18px; margin-bottom: 14px; }
.hero .skyline { position: absolute; inset-inline: 0; bottom: 0; width: 100%; height: 70%; opacity: .55; pointer-events: none; }
.hero .inner { position: relative; }
.hero .bar { padding-bottom: 6px; }
.brand { font-family: var(--font-d); font-weight: 700; line-height: .92; letter-spacing: .2px; }
.brand .t1 { display: block; font-size: 42px; color: #fff; font-style: italic; }
.brand .t2 { display: block; font-size: 64px; color: var(--yellow); font-weight: 800; font-style: italic; margin-top: -2px; }
.tag { margin-top: 8px; font-family: var(--font-d); font-size: 20px; font-style: italic; font-weight: 500; color: #fff; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
html[dir="rtl"] .tag { font-family: var(--font-ar); font-style: normal; font-size: 16px; }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); display: inline-block; }

/* hazard frame + steel panel */
.frame { background: repeating-linear-gradient(-45deg, #F5C518 0 15px, #16181D 15px 30px); padding: 10px; border-radius: 26px; }
.panel { position: relative; background: linear-gradient(180deg, #D6DCE4, #B4BDC9 60%, #C6CED8); border-radius: 18px; padding: 18px 14px 16px; color: var(--ink); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.12); }
.screw { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8E98A6, #3E4652); box-shadow: 0 0 0 1px #2A313B; }
.screw::after { content: ""; position: absolute; left: 3px; right: 3px; top: 6px; height: 2px; background: #1B2028; transform: rotate(35deg); }
.s1 { top: 7px; inset-inline-start: 7px; } .s2 { top: 7px; inset-inline-end: 7px; } .s3 { bottom: 7px; inset-inline-start: 7px; } .s4 { bottom: 7px; inset-inline-end: 7px; }
.plate { display: block; width: max-content; max-width: 100%; margin: 0 auto 12px; background: var(--navy); color: #fff; border-radius: 12px; padding: 5px 22px; font-family: var(--font-d); font-weight: 600; font-size: 21px; letter-spacing: .3px; text-align: center; }
html[dir="rtl"] .plate { font-family: var(--font-ar); font-size: 17px; }
.sys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.sys button { background: var(--pale); border: 2px solid #5E86BF; border-radius: 12px; padding: 8px 4px 8px; min-height: 96px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; text-align: center; }
.sys button.on { border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(245,197,24,.55), 0 0 14px rgba(245,197,24,.55); background: #E3EFFC; }
.sys .nm { font-family: var(--font-d); font-weight: 700; font-size: 19px; line-height: 1.05; }
.sys .sb { font-size: 12px; line-height: 1.15; font-weight: 500; }
html[dir="rtl"] .sys .nm { font-family: var(--font-b); font-size: 16px; }
.sys svg { width: 52px; height: 36px; }
.field { display: grid; grid-template-columns: 42px 1px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 0; border-top: 2px solid rgba(11,27,63,.35); }
.field .fi { width: 38px; height: 38px; color: var(--ink); }
.field .sep { align-self: stretch; background: rgba(11,27,63,.55); width: 1px; }
.field label { display: block; font-family: var(--font-d); font-weight: 700; font-size: 20px; line-height: 1.1; margin-bottom: 4px; }
html[dir="rtl"] .field label { font-family: var(--font-ar); font-size: 15px; }
.field input { width: 100%; height: 46px; border: 2px solid #3E72C8; border-radius: 10px; background: #fff; padding: 0 12px; font-family: var(--font-m); font-size: 16px; color: var(--ink); direction: ltr; text-align: start; }
html[dir="rtl"] .field input { text-align: left; }
.field input::placeholder { color: #6C7A93; font-style: italic; }
.err { grid-column: 1 / -1; color: #8A1C14; background: #FFE3DF; border-radius: 8px; padding: 6px 10px; font-size: 14px; font-weight: 600; }
.go { width: 100%; margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: linear-gradient(180deg, #FFD83D, #F5C518 60%, #E7B400); border: 2px solid #B88A00; border-radius: 16px; min-height: 66px; padding: 0 20px; color: var(--ink); font-family: var(--font-d); font-weight: 700; font-size: 36px; letter-spacing: .3px; box-shadow: 0 3px 0 #8A6A00; }
html[dir="rtl"] .go { font-family: var(--font-ar); font-size: 26px; }
.go svg { width: 34px; height: 34px; flex: none; }
.go .chev { transform: none; } html[dir="rtl"] .go .chev { transform: scaleX(-1); }
.go:active { transform: translateY(2px); box-shadow: 0 1px 0 #8A6A00; }
.eg { margin-top: 12px; font-size: 13px; color: #1D2C4D; }
.eg b { font-weight: 600; display: block; margin-bottom: 6px; }
.eg .row { display: flex; flex-wrap: wrap; gap: 6px; }
.eg button { background: rgba(255,255,255,.7); border: 1.5px solid #5E86BF; border-radius: 14px; padding: 5px 10px; min-height: 36px; font-family: var(--font-m); font-size: 12.5px; color: var(--ink); direction: ltr; }
.eg .clr { background: transparent; border-style: dashed; font-family: inherit; }

/* bottom nav */
.nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.nav button { background: linear-gradient(180deg, #17316F, #0E2250); border: 2px solid #3A5CA8; border-radius: 14px; padding: 10px 4px 8px; min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; font-family: var(--font-d); font-weight: 600; font-size: 16px; line-height: 1.1; color: #fff; }
html[dir="rtl"] .nav button { font-family: var(--font-ar); font-size: 13px; }
.nav svg { width: 34px; height: 34px; color: var(--yellow); }
@media (max-width: 360px) { .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.foot { margin-top: 16px; display: flex; align-items: center; gap: 12px; justify-content: center; color: var(--yellow); font-family: var(--font-d); font-style: italic; font-weight: 600; font-size: 19px; text-align: center; }
html[dir="rtl"] .foot { font-family: var(--font-ar); font-style: normal; font-size: 15px; }
.foot::before, .foot::after { content: ""; height: 2px; flex: 1; background: var(--yellow); opacity: .8; }
.linkish { display: block; margin: 10px auto 0; background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 8px; min-height: 36px; }

/* page titles */
.ph1 { font-family: var(--font-d); font-size: 36px; font-weight: 700; line-height: 1; color: #fff; margin: 4px 0 6px; }
html[dir="rtl"] .ph1 { font-family: var(--font-ar); font-size: 28px; line-height: 1.3; }
.lead { color: var(--muted); font-size: 16px; margin-bottom: 14px; }
.h2 { font-family: var(--font-d); font-size: 26px; font-weight: 700; color: var(--yellow); margin: 22px 0 8px; letter-spacing: .3px; text-wrap: balance; }
html[dir="rtl"] .h2 { font-family: var(--font-ar); font-size: 20px; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; min-width: 0; }
.card h3 { font-family: var(--font-d); font-size: 23px; font-weight: 700; line-height: 1.1; margin-bottom: 6px; text-wrap: balance; }
html[dir="rtl"] .card h3 { font-family: var(--font-ar); font-size: 17px; line-height: 1.4; }
.card p { color: #E2E9F8; }
.card p + p { margin-top: 8px; }
.card .mut { color: var(--muted); font-size: 14px; }
.ill { background: var(--tile); border-radius: 12px; padding: 8px; margin: 10px 0; display: flex; justify-content: center; }
.ill svg { width: 100%; max-width: 360px; height: auto; display: block; }
.ico { width: 64px; height: 64px; border-radius: 14px; background: var(--tile); flex: none; display: grid; place-items: center; overflow: hidden; }
.ico svg { width: 60px; height: 60px; }
.chip { display: inline-block; font-family: var(--font-m); font-weight: 600; font-size: 14px; color: var(--yellow); border: 1.5px solid var(--yellow); background: var(--navy); border-radius: 8px; padding: 1px 8px; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.chip.big { font-size: 17px; padding: 3px 12px; }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.list li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; color: #E2E9F8; }
.list li svg { width: 20px; height: 20px; margin-top: 3px; color: var(--yellow); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: start; color: var(--yellow); font-weight: 600; padding: 6px 8px; border-bottom: 2px solid var(--line); }
.tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; color: #E2E9F8; }
.tbl td:first-child { white-space: nowrap; }
.scroll { overflow-x: auto; }

/* result */
.sysrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.pill { background: var(--yellow); color: var(--ink); font-weight: 700; font-size: 13px; padding: 2px 12px; border-radius: 12px; }
.echo { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.echo .code { font-family: var(--font-m); font-size: 17px; color: var(--yellow); letter-spacing: .3px; overflow-wrap: anywhere; direction: ltr; text-align: start; }
.sum { background: var(--yellow); color: var(--ink); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.sum ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.sum li { font-weight: 600; font-size: 15px; line-height: 1.4; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; }
.sum li::before { content: ""; width: 8px; height: 8px; background: var(--ink); border-radius: 2px; margin-top: 7px; }
.zones { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; align-items: center; color: var(--muted); font-size: 14px; }
.z { font-family: var(--font-m); font-weight: 600; font-size: 14px; padding: 2px 10px; border-radius: 10px; color: var(--ink); direction: ltr; }
.z0, .z20 { background: #FF8A7E; } .z1, .z21 { background: #FFB066; } .z2, .z22 { background: #FFE07A; }
.warn { border: 2px solid var(--yellow); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 14px; color: #FFF3C2; background: rgba(245,197,24,.08); }
.warn svg { width: 22px; height: 22px; color: var(--yellow); margin-top: 1px; }
.warn.bad { border-color: var(--danger); background: rgba(255,138,126,.08); color: #FFD9D4; } .warn.bad svg { color: var(--danger); }
.part { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
.part .ph { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 4px; }
.part .ph b { font-weight: 600; font-size: 16px; line-height: 1.25; }
.part p { font-size: 15px; color: #E2E9F8; }
.part details { margin-top: 6px; }
.part summary { color: var(--yellow); font-size: 14px; font-weight: 600; cursor: pointer; min-height: 32px; display: flex; align-items: center; }
.part details p { color: var(--muted); margin-top: 4px; }
.ipc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; display: grid; gap: 10px; }
.ipc .r { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: start; }
.ipc .r small { display: block; color: var(--muted); font-size: 12.5px; }
.ipc .r svg { width: 48px; height: 48px; background: var(--tile); border-radius: 10px; }
.disc { border: 2px solid var(--yellow); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 13.5px; color: var(--muted); margin-top: 14px; }
.disc svg { width: 20px; height: 20px; color: var(--yellow); margin-top: 2px; }
.btn2 { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin-top: 12px; background: var(--card-hi); border: 2px solid var(--line); border-radius: 12px; font-weight: 600; font-size: 16px; color: #fff; }

/* lessons */
.anat { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; direction: ltr; }
.anat button { font-family: var(--font-m); font-weight: 600; font-size: 15px; border-radius: 8px; padding: 6px 10px; min-height: 40px; border: 2px solid var(--yellow); background: var(--navy); color: var(--yellow); }
.anat button.on { background: var(--yellow); color: var(--ink); }
.anat-d { background: var(--navy); border-radius: 10px; padding: 10px 12px; min-height: 96px; }
.anat-d b { display: block; margin-bottom: 2px; }
.therm { display: grid; gap: 6px; }
.therm .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 62px; gap: 8px; align-items: center; font-size: 14px; }
.therm .bar2 { height: 20px; border-radius: 6px; background: linear-gradient(90deg, #FFE07A, #FF6B5E); }
.therm .v { font-family: var(--font-m); font-size: 13px; text-align: end; color: var(--muted); direction: ltr; }
.digits { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; direction: ltr; }
.digits button { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--navy); color: #fff; font-family: var(--font-m); font-weight: 600; font-size: 18px; }
.digits button.on { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.big-ip { font-family: var(--font-m); font-size: 40px; font-weight: 600; color: var(--yellow); text-align: center; direction: ltr; margin: 4px 0 8px; }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; min-width: 0; height: 46px; border: 2px solid #3E72C8; border-radius: 10px; background: #fff; padding: 0 12px; font-family: var(--font-m); font-size: 16px; color: var(--ink); direction: ltr; }
.inline button { min-width: 84px; height: 46px; border-radius: 10px; border: 0; background: var(--yellow); color: var(--ink); font-weight: 700; }

@media (prefers-reduced-motion: no-preference) {
  .go, .sys button, .nav button, .digits button, .anat button { transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
}
@media (max-width: 380px) {
  .brand .t1 { font-size: 36px; } .brand .t2 { font-size: 54px; }
  .go { font-size: 30px; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
(function (root) {
'use strict';
var L = function (en, ar) { return { en: en, ar: ar }; };

/* ------------------------------------------------------------------ */
/* Reference data (own wording; facts only)                            */
/* ------------------------------------------------------------------ */
var TEMP = { T1: 450, T2: 300, T3: 200, T4: 135, T5: 100, T6: 85 };
var TEMP_NA = { T1: 450, T2: 300, T2A: 280, T2B: 260, T2C: 230, T2D: 215, T3: 200, T3A: 180, T3B: 165, T3C: 160, T4: 135, T4A: 120, T5: 100, T6: 85 };

var ZONE = {
  0: L('Zone 0: an explosive gas atmosphere is present all the time or for long periods.', 'المنطقة 0: الجو الغازي المتفجر موجود طوال الوقت أو لفترات طويلة.'),
  1: L('Zone 1: an explosive gas atmosphere is likely to appear now and then during normal operation.', 'المنطقة 1: يُحتمل ظهور جو غازي متفجر من وقت لآخر أثناء التشغيل العادي.'),
  2: L('Zone 2: an explosive gas atmosphere is not expected in normal operation, and if it appears it stays only briefly.', 'المنطقة 2: لا يُتوقع جو غازي متفجر في التشغيل العادي، وإن ظهر فلفترة قصيرة.'),
  20: L('Zone 20: a cloud of combustible dust is present all the time or for long periods.', 'المنطقة 20: سحابة غبار قابل للاشتعال موجودة طوال الوقت أو لفترات طويلة.'),
  21: L('Zone 21: a dust cloud is likely to appear now and then during normal operation.', 'المنطقة 21: يُحتمل ظهور سحابة غبار من وقت لآخر أثناء التشغيل العادي.'),
  22: L('Zone 22: a dust cloud is not expected in normal operation, and if it appears it stays only briefly.', 'المنطقة 22: لا يُتوقع ظهور سحابة غبار في التشغيل العادي، وإن ظهرت فلفترة قصيرة.')
};

var GAS = {
  'I': { t: L('Gas group I (mines)', 'مجموعة الغاز I (المناجم)'), x: L('Equipment for underground coal mines, where methane (firedamp) is the main danger.', 'معدات لمناجم الفحم الجوفية، حيث يكون غاز الميثان (الغاز الحارق) هو الخطر الرئيسي.'), m: L('Mining equipment has its own rules, separate from the surface industry groups IIA, IIB and IIC.', 'لمعدات المناجم قواعدها الخاصة، المنفصلة عن مجموعات الصناعات السطحية IIA وIIB وIIC.') },

  if (arr.length < 2) return arr.join('');

  return arr.slice(0, -1).join(', ') + w + arr[arr.length - 1];
}

function mkProt(h) {
  var base = h.charAt(0), level = null, sub = null;
  if (h === 'op') base = 'op';
  else if (base === 'n' && h.length === 2) sub = h.charAt(1).toUpperCase();
  else if (h.length === 2) level = h.charAt(1);
  else if (h.length === 3) { sub = h.charAt(1); level = h.charAt(2); }
  if (base === 'p' && h.length === 2 && 'xyz'.indexOf(h.charAt(1)) > -1) { sub = h.charAt(1); level = null; }
  if (base === 'p' && sub) { if (!level) level = sub === 'z' ? 'c' : 'b'; }
  if (base === 'p' && h.length === 1) { level = null; }
  var code = base === 'n' && sub ? 'n' + sub : h;

  var s = tok.toLowerCase(), out = [];
  while (s.length) {
    var hit = null;
    for (var k = 0; k < PROT_TOKS.length; k++) { if (s.indexOf(PROT_TOKS[k]) === 0) { hit = PROT_TOKS[k]; break; } }
    if (!hit) return null;
    out.push(mkProt(hit)); s = s.slice(hit.length);

    for (var j = 0; j < out.length; j++) { if (MULTI_OK.indexOf(out[j].base) < 0 || out[j].base === 'op') return null; }

    var ie = /\b([GDM][abc])\b/.exec(bm[1]);

    s = s.replace(bm[0], ' ' + bm[1].replace(/\b[GDM][abc]\b/g, ' ') + ' ');
  }

    /T(?:a|amb)\s*[:=]?\s*(-?\+?\d{1,3})\s*°?\s*C?\s*(?:to|\.{2,3}|…|–|—|~)\s*\+?\s*(\d{1,3})\s*°?\s*C?/i

    if (c) {
      var k = 'T' + c[1], v = TEMP[k];
      info.tempClass = k; info.tempC = v;
      add({ kind: 'temp', code: k, title: L('Temperature class ' + k, 'فئة الحرارة ' + k), text: L('The surface of the equipment never gets hotter than ' + v + '°C.', 'لا تتجاوز حرارة سطح المعدة ' + v + '°م أبدًا.'), more: L('The gas in your area must ignite at a higher temperature than this. T1 is the hottest class (450°C) and T6 the coolest (85°C).', 'يجب أن يشتعل الغاز في منطقتك عند حرارة أعلى من هذه. T1 أعلى فئة حرارة (450°م) وT6 أدناها (85°م).'), icon: 'temp', arg: String(v) });
      return true;
    }
    c = /^T(\d{2,3})(?:°C|C)?$/i.exec(t);
    if (c) {
      var v2 = parseInt(c[1], 10); info.tempC = v2;
      add({ kind: 'temp', code: 'T' + v2 + '°C', title: L('Maximum surface temperature ' + v2 + '°C', 'أقصى حرارة للسطح ' + v2 + '°م'), text: L('The surface of the equipment never gets hotter than ' + v2 + '°C.', 'لا تتجاوز حرارة سطح المعدة ' + v2 + '°م أبدًا.'), more: L('For dust, keep this value well below the ignition temperature of both a dust cloud and a dust layer. Check the data for your dust.', 'بالنسبة للغبار، يجب أن تبقى هذه القيمة أقل بكثير من حرارة اشتعال سحابة الغبار وطبقة الغبار. راجع بيانات الغبار الخاص بك.'), icon: 'temp', arg: String(v2) });
      return true;
    }
    return false;
  }

  function addEpl(t) {
    var k = t.charAt(0).toUpperCase() + t.charAt(1).toLowerCase();
    var d = EPL[k]; if (!d) return false;
    info.epl.push(k); info.atmos[k.charAt(0)] = 1;
    add({ kind: 'epl', code: k, title: d.t, text: d.x, more: L('EPL means Equipment Protection Level. It states how safe the equipment is, whatever the protection type.', 'EPL تعني مستوى حماية المعدة. وهي تبيّن مدى أمان المعدة بصرف النظر عن نوع الحماية.'), icon: 'epl', arg: k });
    return true;
  }

  for (var i = 0; i < tk.length; i++) {
    var t = tk[i], up = t.toUpperCase(), n;

    if (up === 'CE') { add({ kind: 'ce', code: 'CE', title: L('CE mark', 'علامة CE'), text: L('The maker declares the product meets the EU rules that apply to it. For explosion-protected equipment that is the ATEX directive.', 'يعلن المصنّع أن المنتج يستوفي قواعد الاتحاد الأوروبي المنطبقة عليه. وبالنسبة لمعدات الحماية من الانفجار فهي توجيه ATEX.'), more: L('', ''), icon: 'ce' }); continue; }
    if (last === 'ce' && /^\d{4}$/.test(t)) { add({ kind: 'nb', code: t, title: L('Notified body number', 'رقم الجهة المبلَّغ عنها'), text: L('A four-digit number next to CE. It identifies the body that checks the quality system of the maker.', 'رقم من أربع خانات بجوار CE. يحدد الجهة التي تراجع نظام الجودة لدى المصنّع.'), more: L('', ''), icon: 'cert' }); continue; }

    if (/^(EX|EEX|AEX)$/.test(up)) {
      exSeen = true; state = 'prot';
      var tx = up === 'AEX' ? L('AEx: the US form of Ex, used with the NEC zone system. It means the equipment is explosion-protected.', 'AEx: الصيغة الأمريكية لـ Ex، وتُستخدم مع نظام المناطق في NEC. وتعني أن المعدة محمية من الانفجار.')
        : up === 'EEX' ? L('EEx: the older European form of Ex. It means the equipment is explosion-protected.', 'EEx: الصيغة الأوروبية الأقدم لـ Ex. وتعني أن المعدة محمية من الانفجار.')
          : L('The Ex mark shows the equipment is built and certified for explosive atmospheres, following the IEC 60079 series.', 'علامة Ex تدل على أن المعدة مصنوعة ومعتمدة للأجواء المتفجرة، وفق سلسلة IEC 60079.');
      add({ kind: 'ex', code: t, title: L('Explosion-protected equipment', 'معدة محمية من الانفجار'), text: tx, more: L('', ''), icon: 'ex' });
      continue;
    }

    if (state === 'pre') {
      if (up === 'I' || up === 'II') {
        add({ kind: 'grp', code: up, title: up === 'II' ? L('Equipment group II', 'مجموعة المعدات II') : L('Equipment group I', 'مجموعة المعدات I'), text: up === 'II' ? L('For places above ground with explosive gas or dust, such as oil and gas, chemicals, paint and grain.', 'لأماكن فوق الأرض فيها غاز أو غبار متفجر، مثل النفط والغاز والكيماويات والدهانات والحبوب.') : L('For underground mines at risk from firedamp and coal dust.', 'للمناجم الجوفية المعرّضة لخطر الغاز الحارق وغبار الفحم.'), more: L('', ''), icon: up === 'II' ? 'group2' : 'group1' });
        if (up === 'I') info.atmos.M = 1;
        continue;
      }
      if ((n = /^(M1|M2|[123])(G|D|GD|DG)?$/i.exec(t))) {
        var ck = n[1].toUpperCase(), at = n[2] ? n[2].toUpperCase() : '';
        var cd = CAT[ck];
        var cp = { kind: 'cat', code: t, title: cd.t, text: cd.x, more: L('', ''), icon: 'cat', arg: ck };
        info.cats.push({ k: ck, at: at });
        if (at) {
          var atTxt = at === 'G' ? L('G means gas, vapor or mist.', 'الحرف G يعني غازًا أو بخارًا أو رذاذًا.') : at === 'D' ? L('D means dust.', 'الحرف D يعني غبارًا.') : L('G and D mean it is built for both gas and dust.', 'الحرفان G وD يعنيان أنها مصنوعة للغاز والغبار معًا.');
          cp.more = atTxt;
          if (at.indexOf('G') > -1) info.atmos.G = 1;
          if (at.indexOf('D') > -1) info.atmos.D = 1;
          add(cp); pendingCat = null;
        } else { add(cp); pendingCat = cp; if (ck.charAt(0) === 'M') info.atmos.M = 1; }
        continue;
      }
      if (pendingCat && /^(G|D|GD|DG)$/i.test(t)) {
        var A = t.toUpperCase();
        pendingCat.code = pendingCat.code + A;
        pendingCat.more = A === 'G' ? L('G means gas, vapor or mist.', 'الحرف G يعني غازًا أو بخارًا أو رذاذًا.') : A === 'D' ? L('D means dust.', 'الحرف D يعني غبارًا.') : L('G and D mean it is built for both gas and dust.', 'الحرفان G وD يعنيان أنها مصنوعة للغاز والغبار معًا.');
        info.cats[info.cats.length - 1].at = A;
        if (A.indexOf('G') > -1) info.atmos.G = 1;
        if (A.indexOf('D') > -1) info.atmos.D = 1;
        pendingCat = null; continue;
      }
      // user forgot the Ex symbol: fall through into the protection state
      if (splitProt(t) || /^(IIA|IIB|IIC|IIIA|IIIB|IIIC)$/i.test(t) || /^T\d/i.test(t)) {
        state = 'prot';
        warnings.push(L('No "Ex" symbol was found, so the app read the rest as the protection part.', 'لم يتم العثور على الرمز "Ex"، فقرأ التطبيق الباقي على أنه جزء الحماية.'));
      } else { unknown.push(t); continue; }
    }

    /* after Ex */
    var gm = /^(IIB\+H2|IIIA|IIIB|IIIC|IIA|IIB|IIC)$/i.exec(t);
    if (gm) { addGroup(gm[1]); state = 'post'; continue; }
    if (t === 'I') { addGroup('I'); state = 'post'; continue; }
    if (up === 'II' && state !== 'pre') { addGroup('II'); state = 'post'; continue; }
    if (/^T([1-6]|\d{2,3})(°C|C)?$/i.test(t)) { addTemp(t); state = 'post'; continue; }
    if (/^IP\s?[0-6X][0-9X]/i.test(t)) { info.ip.push(t); continue; }
    if (up === 'X') { add({ kind: 'x', code: 'X', title: L('Special conditions of use', 'شروط خاصة للاستخدام'), text: L('The certificate lists special conditions for safe use. Read them before installing.', 'تذكر الشهادة شروطًا خاصة للاستخدام الآمن. اقرأها قبل التركيب.'), more: L('', ''), icon: 'x' }); continue; }
    if (up === 'U' && state === 'post') { add({ kind: 'u', code: 'U', title: L('Component', 'مكوّن'), text: L('This is a component, not a complete piece of equipment. It needs to be built into something that is itself certified.', 'هذا مكوّن وليس معدة كاملة. يجب تركيبه داخل شيء معتمد بدوره.'), more: L('', ''), icon: 'u' }); continue; }
    if (state === 'prot' && /^[GDM][abc]$/.test(t)) { addEpl(t); continue; }
    if (state === 'post' && /^[GDM][abc]$/i.test(t)) { addEpl(t); continue; }
    if (state === 'prot') {
      if (up === 'OP') {
        var nx = (tk[i + 1] || '').toLowerCase();
        if (nx === 'is' || nx === 'pr' || nx === 'sh') { i++; }
        var po = mkProt('op'); po.code = 'op' + (nx === 'is' || nx === 'pr' || nx === 'sh' ? ' ' + nx : '');
        addProt(po); continue;
      }
      if (t.indexOf('/') > -1) {
        var sp = t.split('/'), okAll = true, lst = [];
        sp.forEach(function (z) { var r = splitProt(z); if (!r) okAll = false; else lst = lst.concat(r); });
        if (okAll) { lst.forEach(addProt); continue; }
      }
      var sp2 = (t === 'I') ? null : splitProt(t);
      if (sp2) { sp2.forEach(addProt); continue; }
    }
    unknown.push(t);
  }

  if (assoc) {
    var innerTxt = L('', ''), innerMore = L('', '');
    if (assocInner && EPL[assocInner]) {
      var iz = EPL[assocInner].z;
      innerTxt = L(' The protected circuit is level ' + assocInner + ', so it can lead into ' + (iz.length ? 'Zone ' + iz[0] : 'a mine') + (iz.length > 1 ? ' and the zones below it' : '') + '.', ' الدائرة المحمية بمستوى ' + assocInner + '، فيمكنها الدخول إلى ' + (iz.length ? 'المنطقة ' + iz[0] : 'منجم') + (iz.length > 1 ? ' والمناطق الأقل خطورة' : '') + '.');
    }
    parts.push({ kind: 'assoc', code: '[ ]', title: L('Associated apparatus', 'معدات مرتبطة'), text: L('Brackets around the protection type mean associated apparatus, such as a barrier. It protects intrinsically safe circuits and normally sits in the safe area.' + innerTxt.en, 'الأقواس حول نوع الحماية تعني معدات مرتبطة، مثل الحاجز. وهي تحمي دوائر الأمان الذاتي وتوضع عادة في المنطقة الآمنة.' + innerTxt.ar), more: innerMore, icon: 'assoc' });
  }
  if (assocCat) {
    parts.push({ kind: 'assoc', code: '(' + assocCat + ')', title: L('Circuits that reach Category ' + assocCat, 'دوائر تصل إلى الفئة ' + assocCat), text: L('The number in brackets shows that the circuits of this equipment can connect to Category ' + assocCat + ' equipment, which sits in a more hazardous zone.', 'الرقم بين القوسين يبيّن أن دوائر هذه المعدة يمكن توصيلها بمعدات الفئة ' + assocCat + '، التي تكون في منطقة أشد خطورة.'), more: L('', ''), icon: 'assoc' });
  }
  if (info.ambient) {
    var am = info.ambient;
    parts.push({ kind: 'amb', code: am.min === null ? 'Ta ≤ +' + am.max : am.min + '…+' + am.max + '°C', title: L('Ambient temperature range', 'مدى حرارة المحيط'), text: am.min === null ? L('Rated for ambient temperatures up to +' + am.max + '°C.', 'مصمَّمة لحرارة محيط تصل إلى +' + am.max + '°م.') : L('Rated for ambient temperatures from ' + am.min + '°C to +' + am.max + '°C. Outside this range the protection is not guaranteed.', 'مصمَّمة لحرارة محيط من ' + am.min + '°م إلى +' + am.max + '°م. خارج هذا المدى لا تُضمن الحماية.'), more: L('', ''), icon: 'temp', arg: 'Ta' });
  }

  /* zones */
  var zs = [];
  info.epl.forEach(function (k) { zs = zs.concat(EPL[k].z); });
  if (!zs.length) {
    info.cats.forEach(function (c) {
      var d = c.at.indexOf('D') > -1, g = c.at.indexOf('G') > -1 || !c.at;
      if (c.k === '1') { if (g) zs = zs.concat([0, 1, 2]); if (d) zs = zs.concat([20, 21, 22]); }
      if (c.k === '2') { if (g) zs = zs.concat([1, 2]); if (d) zs = zs.concat([21, 22]); }
      if (c.k === '3') { if (g) zs = zs.concat([2]); if (d) zs = zs.concat([22]); }
    });
  }
  zs = uniq(zs).sort(function (x, y) { return x - y; });
  info.zones = zs;

  /* checks */
  var epRank = {};
  info.epl.forEach(function (k) { var ch = k.charAt(0); epRank[ch] = Math.max(epRank[ch] || 0, RANK[k.charAt(1)]); });
  info.cats.forEach(function (c) {
    var need = { '1': 3, '2': 2, '3': 1, 'M1': 3, 'M2': 2 }[c.k];
    var ats = c.at === 'GD' || c.at === 'DG' ? ['G', 'D'] : (c.at ? [c.at] : (c.k.charAt(0) === 'M' ? ['M'] : []));
    ats.forEach(function (a) {
      if (epRank[a] !== undefined && epRank[a] < need) warnings.push(L('Category ' + c.k + c.at + ' normally needs a higher protection level than the EPL shown. Check the marking against the certificate.', 'الفئة ' + c.k + c.at + ' تتطلب عادة مستوى حماية أعلى من مستوى EPL المذكور. قارن العلامة بالشهادة.'));
    });
    if (c.at === 'G' && info.epl.length && !epRank.G) warnings.push(L('The category says gas (G) but the protection level is for dust. Check the marking.', 'الفئة تشير إلى غاز (G) بينما مستوى الحماية خاص بالغبار. راجع العلامة.'));
    if (c.at === 'D' && info.epl.length && !epRank.D) warnings.push(L('The category says dust (D) but the protection level is for gas. Check the marking.', 'الفئة تشير إلى غبار (D) بينما مستوى الحماية خاص بالغاز. راجع العلامة.'));
  });
  if (info.dust.length && info.prot.some(function (p) { return p.base !== 't' && ['d', 'e', 'i', 'm', 'o', 'p', 'q', 'n'].indexOf(p.base) > -1 && !info.gas.length && !info.epl.some(function (k) { return k.charAt(0) === 'D'; }); })) {
    /* dust group with gas protection types is allowed (for example ia, mb); no warning */
  }
  if (info.gas.length && info.prot.some(function (p) { return p.base === 't'; }) && !info.dust.length) {
    warnings.push(L('Protection type t is for dust, but a gas group was given. Check the marking.', 'نوع الحماية t خاص بالغبار، بينما ذُكرت مجموعة غاز. راجع العلامة.'));
  }
  if (exSeen && info.tempC === null && info.gas.filter(function (x) { return x !== 'I'; }).length) {
    warnings.push(L('No temperature class (T1 to T6) was found in this marking.', 'لم يُعثر على فئة حرارة (T1 إلى T6) في هذه العلامة.'));
  }
  if (!exSeen && !parts.length) { /* nothing recognized at all */ }

  return { parts: parts, info: info, warnings: warnings, unknown: unknown, exSeen: exSeen };
}

/* summary                                                             */
/* ------------------------------------------------------------------ */
function summarize(info) {
  var S = [], at = info.atmos;
  var g = at.G, d = at.D, mm = at.M;
  if (g && d) S.push(L('For gas and dust atmospheres.', 'للأجواء الغازية وأجواء الغبار.'));
  else if (g) S.push(L('For gas and vapor atmospheres.', 'للأجواء الغازية وأبخرة المواد.'));
  else if (d) S.push(L('For combustible dust atmospheres.', 'لأجواء الغبار القابل للاشتعال.'));
  else if (mm) S.push(L('For underground mines (firedamp).', 'للمناجم الجوفية (الغاز الحارق).'));
  if (info.zones.length) {
    var gz = info.zones.filter(function (z) { return z < 10; }), dz = info.zones.filter(function (z) { return z >= 10; });
    var en = [], ar = [];
    if (gz.length) { en.push('Zone ' + joinOr(gz, 'en')); ar.push('المنطقة ' + joinOr(gz, 'ar')); }
    if (dz.length) { en.push('Zone ' + joinOr(dz, 'en')); ar.push('المنطقة ' + joinOr(dz, 'ar')); }
    S.push(L('Suitable for ' + en.join(' and for ') + '.', 'مناسبة لـ' + ar.join(' ولـ') + '.'));
  }
  if (info.gas.length) {
    var order = ['IIA', 'IIB', 'IIB+H2', 'IIC'], best = null;
    info.gas.forEach(function (x) { if (order.indexOf(x) > order.indexOf(best)) best = x; });
    if (best === 'IIC') S.push(L('Covers gas group IIC, so also IIB and IIA.', 'تشمل مجموعة الغاز IIC، وبالتالي IIB وIIA أيضًا.'));
    else if (best === 'IIB') S.push(L('Covers gas group IIB, so also IIA.', 'تشمل مجموعة الغاز IIB، وبالتالي IIA أيضًا.'));
    else if (best === 'IIA') S.push(L('Covers gas group IIA only.', 'تشمل مجموعة الغاز IIA فقط.'));
    else if (best === 'IIB+H2') S.push(L('Covers gas group IIB and hydrogen.', 'تشمل مجموعة الغاز IIB والهيدروجين.'));
  }
  if (info.dust.length) {
    var o2 = ['IIIA', 'IIIB', 'IIIC'], b2 = null;
    info.dust.forEach(function (x) { if (o2.indexOf(x) > o2.indexOf(b2)) b2 = x; });
    if (b2 === 'IIIC') S.push(L('Covers dust group IIIC (conductive), so also IIIB and IIIA.', 'تشمل مجموعة الغبار IIIC (الموصل)، وبالتالي IIIB وIIIA أيضًا.'));
    else if (b2 === 'IIIB') S.push(L('Covers dust group IIIB, so also IIIA.', 'تشمل مجموعة الغبار IIIB، وبالتالي IIIA أيضًا.'));
    else S.push(L('Covers dust group IIIA only.', 'تشمل مجموعة الغبار IIIA فقط.'));
  }
  if (info.tempC !== null) S.push(L('The surface stays at or below ' + info.tempC + '°C.', 'تبقى حرارة السطح عند ' + info.tempC + '°م أو أقل.'));
  if (info.prot.length) {
    var names = [], namesAr = [];
    info.prot.forEach(function (p) { var b = PROT[p.base]; if (b && names.indexOf(b.n.en) < 0) { names.push(b.n.en); namesAr.push(b.n.ar); } });
    S.push(L('Protection: ' + names.join(', ') + '.', 'الحماية: ' + namesAr.join('، ') + '.'));
  }
  if (info.ambient) {
    var am = info.ambient;
    S.push(am.min === null ? L('Ambient up to +' + am.max + '°C.', 'حرارة المحيط حتى +' + am.max + '°م.') : L('Ambient from ' + am.min + '°C to +' + am.max + '°C.', 'حرارة المحيط من ' + am.min + '°م إلى +' + am.max + '°م.'));
  }
  return S;
}

};
var IPL = {

function decodeIP(str) {

    ].concat(flags(m[4])) };
  }

    ];
    if (m[3]) ps.push({ code: m[3].toUpperCase(), title: L('Extra letter', 'حرف إضافي'), text: L('Some bodies add a letter to their numbering scheme.', 'بعض الجهات تضيف حرفًا إلى نظام الترقيم لديها.') });

function parseNEC(raw) {
  var s = String(raw || '').replace(/[;()]/g, ' ');
  var tk = s.split(/[\s,&\/+]+/).filter(Boolean);
  var info = { classes: [], divs: [], groups: [], zones: [], temps: [], encl: [], ex: null };
  var parts = [], warnings = [], unknown = [], mode = '', rangeFrom = null;
  var roman = function (r) { r = r.toUpperCase(); return { '1': 'I', '2': 'II', '3': 'III' }[r] || r; };
  for (var i = 0; i < tk.length; i++) {
    var t = tk[i], up = t.toUpperCase(), n;
    if (/^(AEX|EX|EEX)$/.test(up)) { info.ex = tk.slice(i).join(' '); break; }
    if (/^(CLASS|CLASSES|CL|CL\.)$/.test(up)) { mode = 'class'; continue; }
    if (/^(DIV|DIV\.|DIVISION|DIVISIONS)$/.test(up)) { mode = 'div'; continue; }
    if (/^(GROUP|GROUPS|GRP|GRP\.)$/.test(up)) { mode = 'group'; continue; }
    if (/^(ZONE|ZONES)$/.test(up)) { mode = 'zone'; continue; }
    if ((n = /^(?:NEMA|TYPE)(\d{1,2}[A-Z]{0,2})$/.exec(up))) { info.encl.push(n[1]); mode = ''; continue; }
    if (/^(NEMA|TYPE)$/.test(up)) { mode = 'encl'; continue; }
    if ((n = /^T(1|2[A-D]?|3[A-C]?|4A?|5|6)$/.exec(up))) { info.temps.push('T' + n[1]); mode = ''; continue; }
    if (up === 'AND') continue;
    if (up === 'TO') { rangeFrom = info.groups.length ? info.groups[info.groups.length - 1] : null; continue; }
    if (mode === 'class' && (n = /^(III|II|I|1|2|3)$/.exec(up))) { info.classes.push(roman(n[1])); continue; }
    if (mode === 'div' && (n = /^([12])$/.exec(up))) { info.divs.push(parseInt(n[1], 10)); continue; }
    if (mode === 'zone' && /^(0|1|2|20|21|22)$/.test(up)) { info.zones.push(parseInt(up, 10)); continue; }
    if (mode === 'encl' && /^\d{1,2}[A-Z]{0,2}$/.test(up)) { info.encl.push(up); mode = ''; continue; }
    if (mode === 'group') {
      if ((n = /^([A-G])-([A-G])$/.exec(up))) { for (var c = n[1].charCodeAt(0); c <= n[2].charCodeAt(0); c++) info.groups.push(String.fromCharCode(c)); continue; }
      if (/^[A-G]+$/.test(up)) {
        if (rangeFrom && up.length === 1) { for (var c2 = rangeFrom.charCodeAt(0) + 1; c2 <= up.charCodeAt(0); c2++) info.groups.push(String.fromCharCode(c2)); rangeFrom = null; continue; }
        up.split('').forEach(function (ch) { info.groups.push(ch); }); continue;
      }
    }
    if (/^IP\s?[0-6X][0-9X]/i.test(t)) { continue; }
    unknown.push(t); mode = '';
  }
  info.classes = uniq(info.classes); info.divs = uniq(info.divs); info.groups = uniq(info.groups).sort(); info.zones = uniq(info.zones); info.temps = uniq(info.temps); info.encl = uniq(info.encl);

  info.classes.forEach(function (c) { var d = NCLASS[c]; parts.push({ kind: 'class', code: 'Class ' + c, title: d.t, text: d.x, more: L('', ''), icon: d.icon }); });
  info.divs.forEach(function (d) { var x = NDIV[d]; parts.push({ kind: 'div', code: 'Div ' + d, title: x.t, text: x.x, more: d === 1 ? L('In the zone system this is roughly Zone 0 and Zone 1.', 'في نظام المناطق يقابل هذا تقريبًا المنطقة 0 والمنطقة 1.') : L('In the zone system this is roughly Zone 2.', 'في نظام المناطق يقابل هذا تقريبًا المنطقة 2.'), icon: 'zone', arg: String(d) }); });
  info.zones.forEach(function (z) { parts.push({ kind: 'zone', code: 'Zone ' + z, title: L('Zone ' + z, 'المنطقة ' + z), text: ZONE[z], more: L('', ''), icon: 'zone', arg: String(z) }); });
  info.groups.forEach(function (g) { var d = NGRP[g]; parts.push({ kind: 'group', code: 'Group ' + g, title: L('Group ' + g, 'المجموعة ' + g), text: d.x, more: d.e, icon: 'ABCD'.indexOf(g) > -1 ? 'gas' : 'dust' }); });
  info.temps.forEach(function (tc) {
    var v = TEMP_NA[tc];
    parts.push({ kind: 'temp', code: tc, title: L('Temperature code ' + tc, 'رمز الحرارة ' + tc), text: L('The surface of the equipment never gets hotter than ' + v + '°C.', 'لا تتجاوز حرارة سطح المعدة ' + v + '°م أبدًا.'), more: L('The gas or dust in your area must ignite at a higher temperature than this. The letters A to D split a class into finer steps.', 'يجب أن يشتعل الغاز أو الغبار في منطقتك عند حرارة أعلى من هذه. الحروف A إلى D تقسّم الفئة إلى درجات أدق.'), icon: 'temp', arg: String(v) });
  });
  info.encl.forEach(function (e) {
    var v = NEMA[e];
    parts.push({ kind: 'nema', code: 'Type ' + e, title: L('Enclosure type ' + e, 'نوع الغلاف ' + e), text: v ? L(v.split('|')[0], v.split('|')[1]) : L('An enclosure type from the NEMA 250 list.', 'نوع غلاف من قائمة NEMA 250.'), more: L('Enclosure types are not the same thing as IP ratings, and they do not convert one to one.', 'أنواع الأغلفة ليست مثل درجات IP، ولا تتحوّل بينها بشكل مباشر.'), icon: 'nema' });
  });

  var sub = null;
  if (info.ex) {
    sub = parseMarking(info.ex);
    sub.parts.forEach(function (p) { parts.push(p); });
    sub.warnings.forEach(function (w) { warnings.push(w); });
    sub.unknown.forEach(function (u) { unknown.push(u); });
  }

  /* checks */
  var hasI = info.classes.indexOf('I') > -1, hasII = info.classes.indexOf('II') > -1, hasIII = info.classes.indexOf('III') > -1;
  var gasG = info.groups.filter(function (g) { return 'ABCD'.indexOf(g) > -1; }), dustG = info.groups.filter(function (g) { return 'EFG'.indexOf(g) > -1; });
  if (gasG.length && info.classes.length && !hasI) warnings.push(L('Groups A to D belong to Class I (gas), but Class I was not given.', 'المجموعات A إلى D تتبع الصنف I (غاز)، لكن الصنف I لم يُذكر.'));
  if (dustG.length && info.classes.length && !hasII) warnings.push(L('Groups E to G belong to Class II (dust), but Class II was not given.', 'المجموعات E إلى G تتبع الصنف II (غبار)، لكن الصنف II لم يُذكر.'));
  if (hasIII && info.groups.length && !hasI && !hasII) warnings.push(L('Class III has no groups. Check the marking.', 'الصنف III ليس له مجموعات. راجع العلامة.'));
  if ((hasI || hasII) && !info.groups.length && !(sub && (sub.info.gas.length || sub.info.dust.length))) warnings.push(L('No group (A to G) was found. The group says which gases or dusts the equipment is approved for.', 'لم يُعثر على مجموعة (A إلى G). المجموعة تحدد الغازات أو الأغبرة المعتمدة للمعدة.'));
  if (info.classes.length && !info.divs.length && !info.zones.length) warnings.push(L('No division or zone was found.', 'لم يُعثر على قسم أو منطقة.'));
  if (info.temps.length === 0 && (hasI || hasII) && !(sub && sub.info.tempC !== null)) warnings.push(L('No temperature code (T1 to T6) was found.', 'لم يُعثر على رمز حرارة (T1 إلى T6).'));

  var S = [];
  if (info.classes.length) {
    var cn = info.classes.map(function (c) { return NCLASS[c].x; });
    S.push(L('Class ' + info.classes.join(', ') + ': ' + cn.map(function (x) { return x.en.replace(/\.$/, '').toLowerCase(); }).join('; ') + '.', 'الصنف ' + info.classes.join('، ') + ': ' + cn.map(function (x) { return x.ar.replace(/\.$/, ''); }).join('؛ ') + '.'));
  }
  if (info.divs.length) {
    S.push(info.divs.indexOf(1) > -1 ? L('Division 1: the hazard can be present in normal operation. The strictest case.', 'القسم 1: قد يوجد الخطر في التشغيل العادي. وهي الحالة الأشد صرامة.') : L('Division 2: the hazard appears only if something fails or leaks.', 'القسم 2: يظهر الخطر فقط عند حدوث عطل أو تسريب.'));
  }
  if (info.groups.length) {
    S.push(L('Group' + (info.groups.length > 1 ? 's ' : ' ') + info.groups.join(', ') + ': ' + info.groups.map(function (g) { return NGRP[g].x.en.replace(/\.$/, '').toLowerCase(); }).join('; ') + '.', (info.groups.length > 1 ? 'المجموعات ' : 'المجموعة ') + info.groups.join('، ') + ': ' + info.groups.map(function (g) { return NGRP[g].x.ar.replace(/\.$/, ''); }).join('؛ ') + '.'));
  }
  if (info.zones.length) S.push(L('Zone ' + joinOr(info.zones.map(String), 'en') + ' (zone system).', 'المنطقة ' + joinOr(info.zones.map(String), 'ar') + ' (نظام المناطق).'));
  if (info.temps.length) { var hot = info.temps.map(function (x) { return TEMP_NA[x]; }).sort(function (a, b) { return b - a; })[0]; S.push(L('The surface stays at or below ' + hot + '°C.', 'تبقى حرارة السطح عند ' + hot + '°م أو أقل.')); }
  if (sub) summarize(sub.info).forEach(function (x) { S.push(x); });

  var zs = info.zones.slice();
  if (sub) zs = zs.concat(sub.info.zones);
  zs = uniq(zs).sort(function (a, b) { return a - b; });

  return { parts: parts, summary: S, warnings: warnings, unknown: unknown, zones: zs, info: info, sub: sub };
}

function analyze(system, marking, ip, cert) {
  var out = { system: system, parts: [], summary: [], warnings: [], unknown: [], zones: [], ip: null, cert: null, recognized: false };

/* Lesson screens: Ex Basics, Hazardous Areas, Protection Types, IP Decoder, About */
function L(en, ar) { return { en: en, ar: ar }; }

function viewBasics() {
  var h = pageHead(S.basicsT, S.basicsL);

  h += card(L('How an explosion starts', 'كيف يبدأ الانفجار'),
    ill(C.triangle(state.lang)) +
    P(L('An explosion needs three things at the same moment: something that burns (a gas, a vapor or a dust), oxygen from the air, and a source of ignition such as a spark or a hot surface. Remove any one of them and there is no explosion.', 'يحتاج الانفجار إلى ثلاثة أشياء في اللحظة نفسها: مادة تحترق (غاز أو بخار أو غبار)، وأكسجين من الهواء، ومصدر اشتعال مثل شرارة أو سطح ساخن. إذا أزلت واحدًا منها فلا يحدث انفجار.')) +
    P(L('In a refinery or a flour mill you cannot remove the fuel or the air. So explosion-protected (Ex) equipment works on the third side: it makes sure the equipment itself can never be the spark.', 'في معمل تكرير أو مطحنة دقيق لا يمكنك إزالة الوقود ولا الهواء. لذلك تعمل المعدات المحمية من الانفجار (Ex) على الضلع الثالث: تضمن ألا تكون المعدة نفسها هي الشرارة.')));

  h += card(L('Why ordinary equipment is not enough', 'لماذا لا تكفي المعدات العادية'),
    P(L('A motor, a switch, a light fitting or even a mobile phone can make small sparks or get hot. In a normal workshop that does no harm. Next to a gas leak it can be the trigger.', 'المحرك والمفتاح الكهربائي وكشاف الإنارة وحتى الهاتف المحمول قد تُصدر شرارة صغيرة أو تسخن. في ورشة عادية لا ضرر من ذلك، أما بجوار تسرّب غاز فقد تكون هي الشرارة الأولى.')) +
    P(L('Static electricity and plain friction count too. That is why hazardous areas have their own rules for tools, clothing and cables, not only for machines.', 'والكهرباء الساكنة والاحتكاك العادي يُحسبان أيضًا. ولهذا فللمناطق الخطرة قواعدها الخاصة بالأدوات والملابس والكابلات، وليس بالماكينات وحدها.')));

  h += card(L('Three systems you will meet', 'ثلاثة أنظمة ستقابلها'),
    '<div class="list" style="gap:12px">' +
    [[C.FLAG_EU, L('ATEX', 'ATEX'), L('The European rules for equipment in explosive atmospheres (EU directive 2014/34/EU). The marking starts with a group and a category, such as II 2G, and the equipment normally also carries a CE mark.', 'القواعد الأوروبية للمعدات في الأجواء المتفجرة (توجيه الاتحاد الأوروبي 2014/34/EU). تبدأ العلامة بمجموعة وفئة مثل II 2G، وتحمل المعدة عادة علامة CE أيضًا.')],
    [C.FLAG_WORLD, L('IECEx', 'IECEx'), L('An international certification scheme. Its markings follow the IEC 60079 standards and start with Ex, as in Ex db IIC T4 Gb. It has no group or category part.', 'نظام اعتماد دولي. تتبع علاماته معايير IEC 60079 وتبدأ بـ Ex كما في Ex db IIC T4 Gb. وليس فيها جزء المجموعة والفئة.')],
    [C.FLAG_NA, L('NEC and CEC', 'NEC وCEC'), L('Used in the USA (National Electrical Code) and Canada (Canadian Electrical Code). The classic style is Class, Division and Group. Newer markings can also use zones, with the AEx or Ex symbol.', 'تُستخدم في أمريكا (الكود الكهربائي الوطني) وكندا (الكود الكهربائي الكندي). الأسلوب التقليدي: الصنف والقسم والمجموعة. وقد تستخدم العلامات الأحدث المناطق أيضًا مع الرمز AEx أو Ex.')]
    ].map(function (r) { return '<div style="display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:start"><div style="width:56px">' + r[0] + '</div><div><b>' + T(r[1]) + '</b><p class="mut" style="color:#E2E9F8">' + T(r[2]) + '</p></div></div>'; }).join('') + '</div>');

  h += card(L('Golden rules', 'القواعد الذهبية'), ulist([
    L('Match the zone. The protection level must be right for the zone where the equipment will sit.', 'طابق المنطقة. يجب أن يناسب مستوى الحماية المنطقة التي ستوضع فيها المعدة.'),
    L('Match the gas or dust. The gas group on the equipment must equal or exceed the one in your area. IIC covers IIB and IIA.', 'طابق الغاز أو الغبار. يجب أن تساوي مجموعة الغاز على المعدة المجموعة الموجودة في منطقتك أو تزيد عليها. IIC تغطي IIB وIIA.'),

    L('Check the ambient range and the IP rating against the real site.', 'قارن مدى حرارة المحيط ودرجة IP بظروف الموقع الفعلية.'),
    L('Read the certificate. An X at the end of its number means special conditions of use apply.', 'اقرأ الشهادة. الحرف X في آخر رقمها يعني وجود شروط خاصة للاستخدام.'),

    table([L('Zone', 'المنطقة'), L('A typical place', 'مكان معتاد')], [
      ['0', L('Inside a fuel tank, above the liquid', 'داخل خزان وقود، فوق سطح السائل')],
      ['1', L('Around a tank vent or a pump seal', 'حول فتحة تنفيس خزان أو حول جلبة مضخة')],

    '<div class="frame"><div class="panel"><i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>' +
    '<span class="plate">' + T(S.selectSystem) + '</span>' +
    '<div class="sys">' + sysBtn('ATEX', C.FLAG_EU, 'ATEX', S.subATEX) + sysBtn('IECEx', C.FLAG_WORLD, 'IECEx', S.subIECEx) + sysBtn('NEC', C.FLAG_NA, 'NEC / CEC', S.subNEC) + '</div>' +
    field('f-m', IC.ui.doc, S.fMarking, state.m, ph[0], state.err ? S.errEmpty : null) +
    field('f-ip', IC.ui.shield, S.fIP, state.ip, ph[1]) +
    field('f-c', IC.ui.cert, S.fCert, state.c, ph[2]) +
    '<button type="button" class="go" data-act="explain"><span style="display:flex;align-items:center;gap:12px;margin-inline:auto">' + IC.ui.search + '<span>' + T(S.explain) + '</span></span><span class="chev">' + IC.ui.chev + '</span></button>' +
    '<div class="eg"><b>' + T(S.tryEx) + '</b><div class="row">' + ex + '<button type="button" class="clr" data-act="clear">' + T(S.clear) + '</button></div></div>' +
    '</div></div>' +
    '<nav class="nav" aria-label="Lessons"><button type="button" data-act="go" data-v="basics">' + IC.ui.book + '<span>' + T(S.nBasics) + '</span></button>' +
    '<button type="button" data-act="go" data-v="areas">' + IC.ui.hazard + '<span>' + T(S.nAreas) + '</span></button>' +
    '<button type="button" data-act="go" data-v="types">' + IC.ui.shield + '<span>' + T(S.nTypes) + '</span></button>' +
    '<button type="button" data-act="go" data-v="ip">' + IC.ui.calc + '<span>' + T(S.nIP) + '</span></button></nav>' +
    '<p class="foot">' + T(S.foot) + '</p><button type="button" class="linkish" data-act="go" data-v="about">' + T(S.about) + '</button>';
}

function partCard(p) {
  var more = p.more && T(p.more) ? '<details><summary>' + T(S.more) + '</summary><p>' + T(p.more) + '</p></details>' : '';
  return '<section class="part"><div class="ico">' + IC.icon(p.icon, p.arg) + '</div><div><div class="ph"><span class="chip">' + esc(p.code) + '</span><b>' + T(p.title) + '</b></div><p>' + T(p.text) + '</p>' + more + '</div></section>';
}

function viewResult() {
  var R = state.result, r = R.r;
  var sysName = { ATEX: 'ATEX', IECEx: 'IECEx', NEC: 'NEC / CEC' }[R.sys];
  var h = topBar(S.result);
  h += '<div class="echo"><div class="sysrow"><span class="pill">' + sysName + '</span></div><div class="code">' + esc(R.m) + '</div></div>';
  if (!r.recognized) {
    h += '<div class="warn bad">' + IC.ui.warn + '<div><b>' + T(S.unrecT) + '</b><br>' + T(S.unrecH) + '</div></div>';
  } else if (r.summary.length) {
    h += '<div class="sum"><ul>' + r.summary.map(function (x) { return '<li>' + T(x) + '</li>'; }).join('') + '</ul></div>';
  }
  if (r.zones.length) h += '<div class="zones"><span>' + T(S.zonesLbl) + '</span>' + r.zones.map(function (z) { return '<span class="z z' + z + '">' + z + '</span>'; }).join('') + '</div>';
  if (r.warnings.length || r.unknown.length) {
    h += '<h2 class="h2">' + T(S.checksH) + '</h2>';
    r.warnings.forEach(function (w) { h += '<div class="warn">' + IC.ui.warn + '<div>' + T(w) + '</div></div>'; });
    if (r.unknown.length) h += '<div class="warn">' + IC.ui.info + '<div>' + T(S.unkTok) + ' <span class="ltr mono">' + esc(r.unknown.join(' ')) + '</span></div></div>';
  }
  if (r.parts.length) { h += '<h2 class="h2">' + T(S.partsH) + '</h2>'; r.parts.forEach(function (p) { h += partCard(p); }); }
  if (r.ip) { h += '<h2 class="h2">' + T(S.ipH) + '</h2>' + ipItemsHtml(r.ip); }
  if (r.cert) {
    h += '<h2 class="h2">' + T(S.certH) + '</h2>';
    if (r.cert.kind === 'unknown') h += '<div class="warn">' + IC.ui.info + '<div>' + T(S.certUnk) + '</div></div>';
    else r.cert.parts.forEach(function (p) { h += partCard({ code: p.code, title: p.title, text: p.text, more: null, icon: /^[XU]$/.test(p.code) ? p.code.toLowerCase() : 'cert' }); });
  }
  h += '<div class="disc">' + IC.ui.info + '<div><p>' + T(S.disc1) + '</p><p style="margin-top:6px">' + T(S.disc2) + '</p></div></div>';
  h += '<button type="button" class="btn2" data-act="go" data-v="home">' + T(S.again) + '</button>';
  return h;
}

function viewLesson(fn) { return topBar(S.back) + fn(); }

function viewFor(v) {
  switch (v) {
    case 'result': return viewResult();
    case 'basics': return viewLesson(viewBasics);
    case 'areas': return viewLesson(viewAreas);
    case 'types': return viewLesson(viewTypes);
    case 'ip': return viewLesson(viewIP);
    case 'about': return viewLesson(viewAbout);
    default: return viewHome();
  }
}

function render(keepScroll) {
  var de = document.documentElement;
  de.lang = state.lang; de.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  $app.innerHTML = viewFor(state.view);
  if (!keepScroll) window.scrollTo(0, 0);
}

function route() {
  var v = (location.hash || '').replace('#', '');
  if (['home', 'result', 'basics', 'areas', 'types', 'ip', 'about'].indexOf(v) < 0) v = 'home';
  if (v === 'result' && !state.result) v = 'home';
  state.view = v;
  render(false);
}

function go(v) { if (location.hash === '#' + v) route(); else location.hash = v; }

function explain() {
  state.m = (document.getElementById('f-m') || {}).value || state.m;
  if (!String(state.m).trim()) { state.err = 'x'; render(true); var f = document.getElementById('f-m'); if (f) f.focus(); return; }
  state.err = '';
  var r = ExEngine.analyze(state.sys, state.m, state.ip, state.c);
  state.result = { r: r, sys: state.sys, m: state.m };
  go('result');
}

function setSystem(k) {
  var prev = EX[state.sys];
  var next = EX[k];
  if (!String(state.m).trim() || state.m === prev.m) state.m = next.m;
  if (!String(state.ip).trim() || state.ip === prev.ip) state.ip = next.ip;
  if (!String(state.c).trim() || state.c === prev.c) state.c = next.c;
  state.sys = k; state.err = '';
  render(true);
}

document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  var a = t.getAttribute('data-act');
  if (a === 'lang') {
    state.lang = t.getAttribute('data-l');
    try { localStorage.setItem('exlang', state.lang); } catch (x) { }
    render(true);
  } else if (a === 'go') { go(t.getAttribute('data-v')); }
  else if (a === 'sys') { setSystem(t.getAttribute('data-k')); }
  else if (a === 'explain') { explain(); }
  else if (a === 'ex') { state.m = EX[state.sys].list[parseInt(t.getAttribute('data-i'), 10)]; state.err = ''; render(true); }
  else if (a === 'clear') { state.m = ''; state.ip = ''; state.c = ''; state.err = ''; render(true); var f = document.getElementById('f-m'); if (f) f.focus(); }
  else if (a === 'anat') {
    var i = parseInt(t.getAttribute('data-i'), 10);
    var kids = t.parentNode.children; for (var k = 0; k < kids.length; k++) kids[k].className = k === i ? 'on' : '';
    document.getElementById('anatd').innerHTML = anatDetail(i);
  } else if (a === 'ipd') {
    IPS[t.getAttribute('data-w')] = t.getAttribute('data-d');
    var sibs = t.parentNode.children; for (var q = 0; q < sibs.length; q++) { var on = sibs[q] === t; sibs[q].className = on ? 'on' : ''; sibs[q].setAttribute('aria-pressed', on); }
    document.getElementById('ippick').innerHTML = ipPickerBody();
  } else if (a === 'ipdec') {
    var v = document.getElementById('ipcode').value;
    var res = ExEngine.decodeIP(v);
    document.getElementById('ipout').innerHTML = res ? ipItemsHtml(res) : '';
  }
});
document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'f-m') { state.m = e.target.value; if (state.err) { state.err = ''; var er = document.getElementById('err'); if (er) er.remove(); } }
  else if (id === 'f-ip') state.ip = e.target.value;
  else if (id === 'f-c') state.c = e.target.value;
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var id = e.target.id;
  if (id === 'f-m' || id === 'f-ip' || id === 'f-c') { e.preventDefault(); explain(); }
  else if (id === 'ipcode') { e.preventDefault(); document.querySelector('[data-act="ipdec"]').click(); }
});
document.addEventListener('focusin', function (e) {
  var id = e.target.id;
  if (id === 'f-m' && e.target.value === EX[state.sys].m) { try { e.target.select(); } catch (x) { } }
});
window.addEventListener('hashchange', route);

/* ads: stays off until an ad unit id is set, and only runs inside the Android app */
function initAds() {
  var AdMob = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob;
  if (!AdMob || !AD_BANNER_ID) return;
  AdMob.initialize().then(function () {
    return AdMob.requestConsentInfo().then(function (info) {
      if (info && info.isConsentFormAvailable && info.status === 'REQUIRED') return AdMob.showConsentForm();
    });
  }).then(function () {
    document.body.style.paddingBottom = '64px';
    return AdMob.showBanner({ adId: ADMOB_TESTING ? 'ca-app-pub-3940256099942544/6300978111' : AD_BANNER_ID, adSize: 'ADAPTIVE_BANNER', position: 'BOTTOM_CENTER', margin: 0, isTesting: ADMOB_TESTING });
  }).catch(function () { });
}

route();
initAds();

</script>
</body>
</html>
