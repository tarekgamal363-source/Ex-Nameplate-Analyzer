<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08142F">
<title>Ex Nameplate Analyzer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700;1,800&family=Barlow:wght@400;500;600;700&family=Cairo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout concept: one phone-width column. Hazard-stripe frame around a steel control panel on the home screen; navy pages with yellow signal accents for results and lessons. */
:root {
  --bg: #08142F;
  --navy: #0B1B3F;
  --card: #13295C;
  --card-hi: #1A3470;
  --line: #27468A;
  --yellow: #F5C518;
  --yellow-deep: #D9A900;
  --ink: #0B1B3F;
  --text: #FFFFFF;
  --muted: #B9C6E4;
  --steel: #C3CBD6;
  --steel-deep: #9AA5B4;
  --pale: #CFE2F7;
  --tile: #DCE9F8;
  --danger: #FF8A7E;
  --ok: #5BD6A0;
  --font-d: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --font-b: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-ar: 'Cairo', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --font-m: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-b);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-text-size-adjust: 100%;
}
html[dir="rtl"] body { font-family: var(--font-ar); line-height: 1.7; }
#app { max-width: 520px; margin: 0 auto; padding-block: 12px 28px; min-width: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 3px solid var(--yellow); outline-offset: 2px;
}
h1, h2, h3, p { margin: 0; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.mono { font-family: var(--font-m); }
svg { max-width: 100%; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 12px; }
.back { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 8px 4px; min-height: 44px; color: var(--yellow); font-family: var(--font-d); font-size: 22px; font-weight: 600; letter-spacing: .3px; }
html[dir="rtl"] .back { font-family: var(--font-ar); font-size: 18px; }
.back svg { width: 22px; height: 22px; }
html[dir="rtl"] .back svg { transform: scaleX(-1); }
.lang { display: inline-flex; border: 2px solid var(--yellow); border-radius: 18px; overflow: hidden; background: var(--navy); flex: none; }
.lang button { background: transparent; border: 0; padding: 6px 14px; min-height: 38px; font-size: 14px; font-weight: 600; color: #fff; font-family: var(--font-b); }
.lang button.on { background: var(--yellow); color: var(--ink); }
.lang button[data-l="ar"] { font-family: var(--font-ar); }

/* hero */
.hero { position: relative; border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #0C2250 0%, #12326F 55%, #0B1B3F 100%); padding: 18px 16px 18px; margin-bottom: 14px; }
.hero .skyline { position: absolute; inset-inline: 0; bottom: 0; width: 100%; height: 70%; opacity: .55; pointer-events: none; }
.hero .inner { position: relative; }
.hero .bar { padding-bottom: 6px; }
.brand { font-family: var(--font-d); font-weight: 700; line-height: .92; letter-spacing: .2px; }
.brand .t1 { display: block; font-size: 42px; color: #fff; font-style: italic; }
.brand .t2 { display: block; font-size: 64px; color: var(--yellow); font-weight: 800; font-style: italic; margin-top: -2px; }
.tag { margin-top: 8px; font-family: var(--font-d); font-size: 20px; font-style: italic; font-weight: 500; color: #fff; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
html[dir="rtl"] .tag { font-family: var(--font-ar); font-style: normal; font-size: 16px; }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); display: inline-block; }

/* hazard frame + steel panel */
.frame { background: repeating-linear-gradient(-45deg, #F5C518 0 15px, #16181D 15px 30px); padding: 10px; border-radius: 26px; }
.panel { position: relative; background: linear-gradient(180deg, #D6DCE4, #B4BDC9 60%, #C6CED8); border-radius: 18px; padding: 18px 14px 16px; color: var(--ink); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.12); }
.screw { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8E98A6, #3E4652); box-shadow: 0 0 0 1px #2A313B; }
.screw::after { content: ""; position: absolute; left: 3px; right: 3px; top: 6px; height: 2px; background: #1B2028; transform: rotate(35deg); }
.s1 { top: 7px; inset-inline-start: 7px; } .s2 { top: 7px; inset-inline-end: 7px; } .s3 { bottom: 7px; inset-inline-start: 7px; } .s4 { bottom: 7px; inset-inline-end: 7px; }
.plate { display: block; width: max-content; max-width: 100%; margin: 0 auto 12px; background: var(--navy); color: #fff; border-radius: 12px; padding: 5px 22px; font-family: var(--font-d); font-weight: 600; font-size: 21px; letter-spacing: .3px; text-align: center; }
html[dir="rtl"] .plate { font-family: var(--font-ar); font-size: 17px; }
.sys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.sys button { background: var(--pale); border: 2px solid #5E86BF; border-radius: 12px; padding: 8px 4px 8px; min-height: 96px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; text-align: center; }
.sys button.on { border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(245,197,24,.55), 0 0 14px rgba(245,197,24,.55); background: #E3EFFC; }
.sys .nm { font-family: var(--font-d); font-weight: 700; font-size: 19px; line-height: 1.05; }
.sys .sb { font-size: 12px; line-height: 1.15; font-weight: 500; }
html[dir="rtl"] .sys .nm { font-family: var(--font-b); font-size: 16px; }
.sys svg { width: 52px; height: 36px; }
.field { display: grid; grid-template-columns: 42px 1px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 0; border-top: 2px solid rgba(11,27,63,.35); }
.field .fi { width: 38px; height: 38px; color: var(--ink); }
.field .sep { align-self: stretch; background: rgba(11,27,63,.55); width: 1px; }
.field label { display: block; font-family: var(--font-d); font-weight: 700; font-size: 20px; line-height: 1.1; margin-bottom: 4px; }
html[dir="rtl"] .field label { font-family: var(--font-ar); font-size: 15px; }
.field input { width: 100%; height: 46px; border: 2px solid #3E72C8; border-radius: 10px; background: #fff; padding: 0 12px; font-family: var(--font-m); font-size: 16px; color: var(--ink); direction: ltr; text-align: start; }
html[dir="rtl"] .field input { text-align: left; }
.field input::placeholder { color: #6C7A93; font-style: italic; }
.err { grid-column: 1 / -1; color: #8A1C14; background: #FFE3DF; border-radius: 8px; padding: 6px 10px; font-size: 14px; font-weight: 600; }
.go { width: 100%; margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: linear-gradient(180deg, #FFD83D, #F5C518 60%, #E7B400); border: 2px solid #B88A00; border-radius: 16px; min-height: 66px; padding: 0 20px; color: var(--ink); font-family: var(--font-d); font-weight: 700; font-size: 36px; letter-spacing: .3px; box-shadow: 0 3px 0 #8A6A00; }
html[dir="rtl"] .go { font-family: var(--font-ar); font-size: 26px; }
.go svg { width: 34px; height: 34px; flex: none; }
.go .chev { transform: none; } html[dir="rtl"] .go .chev { transform: scaleX(-1); }
.go:active { transform: translateY(2px); box-shadow: 0 1px 0 #8A6A00; }
.eg { margin-top: 12px; font-size: 13px; color: #1D2C4D; }
.eg b { font-weight: 600; display: block; margin-bottom: 6px; }
.eg .row { display: flex; flex-wrap: wrap; gap: 6px; }
.eg button { background: rgba(255,255,255,.7); border: 1.5px solid #5E86BF; border-radius: 14px; padding: 5px 10px; min-height: 36px; font-family: var(--font-m); font-size: 12.5px; color: var(--ink); direction: ltr; }
.eg .clr { background: transparent; border-style: dashed; font-family: inherit; }

/* bottom nav */
.nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.nav button { background: linear-gradient(180deg, #17316F, #0E2250); border: 2px solid #3A5CA8; border-radius: 14px; padding: 10px 4px 8px; min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; font-family: var(--font-d); font-weight: 600; font-size: 16px; line-height: 1.1; color: #fff; }
html[dir="rtl"] .nav button { font-family: var(--font-ar); font-size: 13px; }
.nav svg { width: 34px; height: 34px; color: var(--yellow); }
@media (max-width: 360px) { .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.foot { margin-top: 16px; display: flex; align-items: center; gap: 12px; justify-content: center; color: var(--yellow); font-family: var(--font-d); font-style: italic; font-weight: 600; font-size: 19px; text-align: center; }
html[dir="rtl"] .foot { font-family: var(--font-ar); font-style: normal; font-size: 15px; }
.foot::before, .foot::after { content: ""; height: 2px; flex: 1; background: var(--yellow); opacity: .8; }
.linkish { display: block; margin: 10px auto 0; background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 8px; min-height: 36px; }

/* page titles */
.ph1 { font-family: var(--font-d); font-size: 36px; font-weight: 700; line-height: 1; color: #fff; margin: 4px 0 6px; }
html[dir="rtl"] .ph1 { font-family: var(--font-ar); font-size: 28px; line-height: 1.3; }
.lead { color: var(--muted); font-size: 16px; margin-bottom: 14px; }
.h2 { font-family: var(--font-d); font-size: 26px; font-weight: 700; color: var(--yellow); margin: 22px 0 8px; letter-spacing: .3px; text-wrap: balance; }
html[dir="rtl"] .h2 { font-family: var(--font-ar); font-size: 20px; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; min-width: 0; }
.card h3 { font-family: var(--font-d); font-size: 23px; font-weight: 700; line-height: 1.1; margin-bottom: 6px; text-wrap: balance; }
html[dir="rtl"] .card h3 { font-family: var(--font-ar); font-size: 17px; line-height: 1.4; }
.card p { color: #E2E9F8; }
.card p + p { margin-top: 8px; }
.card .mut { color: var(--muted); font-size: 14px; }
.ill { background: var(--tile); border-radius: 12px; padding: 8px; margin: 10px 0; display: flex; justify-content: center; }
.ill svg { width: 100%; max-width: 360px; height: auto; display: block; }
.ico { width: 64px; height: 64px; border-radius: 14px; background: var(--tile); flex: none; display: grid; place-items: center; overflow: hidden; }
.ico svg { width: 60px; height: 60px; }
.chip { display: inline-block; font-family: var(--font-m); font-weight: 600; font-size: 14px; color: var(--yellow); border: 1.5px solid var(--yellow); background: var(--navy); border-radius: 8px; padding: 1px 8px; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.chip.big { font-size: 17px; padding: 3px 12px; }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.list li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; color: #E2E9F8; }
.list li svg { width: 20px; height: 20px; margin-top: 3px; color: var(--yellow); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: start; color: var(--yellow); font-weight: 600; padding: 6px 8px; border-bottom: 2px solid var(--line); }
.tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; color: #E2E9F8; }
.tbl td:first-child { white-space: nowrap; }
.scroll { overflow-x: auto; }

/* result */
.sysrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.pill { background: var(--yellow); color: var(--ink); font-weight: 700; font-size: 13px; padding: 2px 12px; border-radius: 12px; }
.echo { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.echo .code { font-family: var(--font-m); font-size: 17px; color: var(--yellow); letter-spacing: .3px; overflow-wrap: anywhere; direction: ltr; text-align: start; }
.sum { background: var(--yellow); color: var(--ink); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.sum ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.sum li { font-weight: 600; font-size: 15px; line-height: 1.4; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; }
.sum li::before { content: ""; width: 8px; height: 8px; background: var(--ink); border-radius: 2px; margin-top: 7px; }
.zones { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; align-items: center; color: var(--muted); font-size: 14px; }
.z { font-family: var(--font-m); font-weight: 600; font-size: 14px; padding: 2px 10px; border-radius: 10px; color: var(--ink); direction: ltr; }
.z0, .z20 { background: #FF8A7E; } .z1, .z21 { background: #FFB066; } .z2, .z22 { background: #FFE07A; }
.warn { border: 2px solid var(--yellow); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 14px; color: #FFF3C2; background: rgba(245,197,24,.08); }
.warn svg { width: 22px; height: 22px; color: var(--yellow); margin-top: 1px; }
.warn.bad { border-color: var(--danger); background: rgba(255,138,126,.08); color: #FFD9D4; } .warn.bad svg { color: var(--danger); }
.part { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
.part .ph { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 4px; }
.part .ph b { font-weight: 600; font-size: 16px; line-height: 1.25; }
.part p { font-size: 15px; color: #E2E9F8; }
.part details { margin-top: 6px; }
.part summary { color: var(--yellow); font-size: 14px; font-weight: 600; cursor: pointer; min-height: 32px; display: flex; align-items: center; }
.part details p { color: var(--muted); margin-top: 4px; }
.ipc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; display: grid; gap: 10px; }
.ipc .r { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: start; }
.ipc .r small { display: block; color: var(--muted); font-size: 12.5px; }
.ipc .r svg { width: 48px; height: 48px; background: var(--tile); border-radius: 10px; }
.disc { border: 2px solid var(--yellow); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 13.5px; color: var(--muted); margin-top: 14px; }
.disc svg { width: 20px; height: 20px; color: var(--yellow); margin-top: 2px; }
.btn2 { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin-top: 12px; background: var(--card-hi); border: 2px solid var(--line); border-radius: 12px; font-weight: 600; font-size: 16px; color: #fff; }

/* lessons */
.anat { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; direction: ltr; }
.anat button { font-family: var(--font-m); font-weight: 600; font-size: 15px; border-radius: 8px; padding: 6px 10px; min-height: 40px; border: 2px solid var(--yellow); background: var(--navy); color: var(--yellow); }
.anat button.on { background: var(--yellow); color: var(--ink); }
.anat-d { background: var(--navy); border-radius: 10px; padding: 10px 12px; min-height: 96px; }
.anat-d b { display: block; margin-bottom: 2px; }
.therm { display: grid; gap: 6px; }
.therm .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 62px; gap: 8px; align-items: center; font-size: 14px; }
.therm .bar2 { height: 20px; border-radius: 6px; background: linear-gradient(90deg, #FFE07A, #FF6B5E); }
.therm .v { font-family: var(--font-m); font-size: 13px; text-align: end; color: var(--muted); direction: ltr; }
.digits { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; direction: ltr; }
.digits button { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--navy); color: #fff; font-family: var(--font-m); font-weight: 600; font-size: 18px; }
.digits button.on { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.big-ip { font-family: var(--font-m); font-size: 40px; font-weight: 600; color: var(--yellow); text-align: center; direction: ltr; margin: 4px 0 8px; }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; min-width: 0; height: 46px; border: 2px solid #3E72C8; border-radius: 10px; background: #fff; padding: 0 12px; font-family: var(--font-m); font-size: 16px; color: var(--ink); direction: ltr; }
.inline button { min-width: 84px; height: 46px; border-radius: 10px; border: 0; background: var(--yellow); color: var(--ink); font-weight: 700; }

@media (prefers-reduced-motion: no-preference) {
  .go, .sys button, .nav button, .digits button, .anat button { transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
}
@media (max-width: 380px) {
  .brand .t1 { font-size: 36px; } .brand .t2 { font-size: 54px; }
  .go { font-size: 30px; }
}

/* ---- one-screen home ---- */
.deep { margin-top: 6px; border-inline-start: 3px solid var(--yellow); padding-inline-start: 10px; }
.deep p { font-size: 14.5px; color: #E2E9F8; }
.deep p + p { margin-top: 6px; }
.deep b { color: var(--yellow); font-weight: 600; margin-inline-end: 4px; }
.card h4 { font-family: var(--font-d); font-size: 19px; color: var(--yellow); margin: 12px 0 4px; }
html[dir="rtl"] .card h4 { font-family: var(--font-ar); font-size: 16px; }
.plain { list-style: none; padding: 0; margin: 0; }
.plain li { font-size: 14.5px; color: #E2E9F8; padding: 4px 0; border-top: 1px solid var(--line); }
.plain li:first-child { border-top: 0; }
.plain li b { color: #fff; }
.read { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.read li { font-size: 13.5px; background: rgba(255,255,255,.06); border-radius: 10px; padding: 5px 8px; }
.home { min-height: calc(100dvh - 22px); display: flex; flex-direction: column; gap: 8px; }
.home .hero { margin: 0; padding: 8px 12px 10px; border-radius: 16px; }
.home .hero .bar { padding: 0 0 2px; }
.home .hero .inner { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.home .hero .bar { order: 2; padding: 0; }
.home .brand { order: 1; display: block; margin: 0; line-height: .95; }
.home .brand .t1 { font-size: 24px; display: block; }
.home .brand .t2 { font-size: 32px; display: block; margin: 0; }
.home .tag { display: none; }
.home .lang button { min-height: 30px; padding: 3px 12px; font-size: 13px; }
.home .frame { padding: 6px; border-radius: 20px; }
.home .panel { padding: 12px 10px 10px; border-radius: 14px; }
.home .screw { display: none; }
.home .plate { margin-bottom: 8px; padding: 2px 16px; font-size: 16px; }
.home .sys { gap: 6px; margin-bottom: 8px; }
.home .sys button { min-height: 62px; padding: 4px 2px; gap: 1px; }
.home .sys svg { width: 36px; height: 24px; }
.home .sys .nm { font-size: 16px; }
.home .sys .sb { font-size: 11px; }
.home .field { padding: 6px 0 4px; gap: 8px; grid-template-columns: 30px 1px minmax(0, 1fr); }
.home .field .fi { width: 28px; height: 28px; }
.home .field label { font-size: 16px; margin-bottom: 2px; }
.home .field input { height: 40px; }
.home .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.home .two .field { grid-template-columns: minmax(0, 1fr); }
.home .two .field .fi, .home .two .field .sep { display: none; }
.home .two .field label { font-size: 14px; }
.home .go { min-height: 50px; font-size: 26px; margin-top: 6px; padding: 0 14px; }
.home .go svg { width: 26px; height: 26px; }
.home .eg { margin-top: 6px; }
.home .eg b { display: none; }
.home .eg .row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.home .eg .row::-webkit-scrollbar { display: none; }
.home .eg button { flex: none; min-height: 30px; padding: 3px 9px; }
.home .nav { margin-top: 0; gap: 6px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.home .nav button { min-height: 76px; padding: 6px 2px; gap: 4px; font-size: 14px; }
.home .nav svg { width: 28px; height: 28px; }
html[dir="rtl"] .home .nav button { font-size: 12px; }
.home .foot { margin-top: auto; font-size: 15px; }

<script>
(function (root) {

var L = function (en, ar) { return { en: en, ar: ar }; };

/* ------------------------------------------------------------------ */

var TEMP = { T1: 450, T2: 300, T3: 200, T4: 135, T5: 100, T6: 85 };

var ZONE = {
  0: L('Zone 0: an explosive gas atmosphere is present all the time or for long periods.', 'المنطقة 0: الجو الغازي المتفجر موجود طوال الوقت أو لفترات طويلة.'),
  1: L('Zone 1: an explosive gas atmosphere is likely to appear now and then during normal operation.', 'المنطقة 1: يُحتمل ظهور جو غازي متفجر من وقت لآخر أثناء التشغيل العادي.'),
  2: L('Zone 2: an explosive gas atmosphere is not expected in normal operation, and if it appears it stays only briefly.', 'المنطقة 2: لا يُتوقع جو غازي متفجر في التشغيل العادي، وإن ظهر فلفترة قصيرة.'),

};

var GAS = {

  'II': { t: L('Gas group II', 'مجموعة الغاز II'), x: L('Equipment for gases in surface industries. The letter (A, B, C) is not given here, so the marking covers the general case.', 'معدات للغازات في الصناعات السطحية. لم يُذكر الحرف (A أو B أو C)، فالعلامة تشير إلى الحالة العامة.'), m: L('Types such as e, n and ec are often marked with plain II because they do not depend on how easily the gas ignites.', 'أنواع مثل e وn وec تُكتب غالبًا بـ II فقط لأنها لا تعتمد على سهولة اشتعال الغاز.') },
  'IIA': { t: L('Gas group IIA', 'مجموعة الغاز IIA'), x: L('The least easily ignited gas group. Typical gases: propane and many solvents and fuels.', 'أقل مجموعات الغاز قابلية للاشتعال. أمثلتها: البروبان وكثير من المذيبات والوقود.'), m: L('IIA equipment can only be used with IIA gases.', 'معدات IIA تُستخدم مع غازات IIA فقط.') },
  'IIB': { t: L('Gas group IIB', 'مجموعة الغاز IIB'), x: L('A more easily ignited group. Typical gas: ethylene.', 'مجموعة أسهل اشتعالًا. من أمثلتها غاز الإيثيلين.'), m: L('IIB equipment also suits IIA gases.', 'معدات IIB تناسب أيضًا غازات IIA.') },

  'IIC': { t: L('Gas group IIC', 'مجموعة الغاز IIC'), x: L('The most easily ignited gas group. Typical gases: hydrogen and acetylene.', 'أسهل مجموعات الغاز اشتعالًا. من أمثلتها الهيدروجين والأسيتيلين.'), m: L('IIC equipment also suits IIB and IIA gases.', 'معدات IIC تناسب أيضًا غازات IIB وIIA.') }
};
var DUST = {

  'IIIB': { t: L('Dust group IIIB', 'مجموعة الغبار IIIB'), x: L('Non-conductive dust, such as grain, flour, wood and plastic powders.', 'غبار غير موصل للكهرباء، مثل الحبوب والدقيق والخشب ومساحيق البلاستيك.'), m: L('IIIB equipment also suits IIIA.', 'معدات IIIB تناسب أيضًا IIIA.') },
  'IIIC': { t: L('Dust group IIIC', 'مجموعة الغبار IIIC'), x: L('Conductive dust, such as metal powders and carbon.', 'غبار موصل للكهرباء، مثل مساحيق المعادن والكربون.'), m: L('IIIC equipment also suits IIIB and IIIA.', 'معدات IIIC تناسب أيضًا IIIB وIIIA.') }

var CAT = {
  'M1': { t: L('Category M1', 'الفئة M1'), x: L('Very high protection for mines. The equipment can keep working even when firedamp is present.', 'حماية عالية جدًا للمناجم. يمكن للمعدة أن تستمر في العمل حتى مع وجود الغاز الحارق.') },

  '2': { t: L('Category 2', 'الفئة 2'), x: L('High protection. The equipment stays safe in normal operation and with faults that are expected. For Zone 1 (gas) or Zone 21 (dust).', 'حماية عالية. تبقى المعدة آمنة في التشغيل العادي ومع الأعطال المتوقعة. للمنطقة 1 (غاز) أو 21 (غبار).') },
  '3': { t: L('Category 3', 'الفئة 3'), x: L('Normal protection. The equipment is safe in normal operation. For Zone 2 (gas) or Zone 22 (dust).', 'حماية عادية. المعدة آمنة في التشغيل العادي. للمنطقة 2 (غاز) أو 22 (غبار).') }

var EPL = {

  Gb: { t: L('Protection level Gb', 'مستوى الحماية Gb'), x: L('High protection for gas. Suits Zone 1, and also Zone 2.', 'حماية عالية للغاز. يناسب المنطقة 1، وكذلك المنطقة 2.'), z: [1, 2] },
  Gc: { t: L('Protection level Gc', 'مستوى الحماية Gc'), x: L('Enhanced protection for gas. Suits Zone 2.', 'حماية معززة للغاز. يناسب المنطقة 2.'), z: [2] },
  Da: { t: L('Protection level Da', 'مستوى الحماية Da'), x: L('Very high protection for dust. Suits Zone 20, and also Zones 21 and 22.', 'حماية عالية جدًا للغبار. يناسب المنطقة 20، وكذلك المنطقتين 21 و22.'), z: [20, 21, 22] },
  Db: { t: L('Protection level Db', 'مستوى الحماية Db'), x: L('High protection for dust. Suits Zone 21, and also Zone 22.', 'حماية عالية للغبار. يناسب المنطقة 21، وكذلك المنطقة 22.'), z: [21, 22] },
  Dc: { t: L('Protection level Dc', 'مستوى الحماية Dc'), x: L('Enhanced protection for dust. Suits Zone 22.', 'حماية معززة للغبار. يناسب المنطقة 22.'), z: [22] },
  Ma: { t: L('Protection level Ma', 'مستوى الحماية Ma'), x: L('Very high protection for mines. Can stay energized in a firedamp atmosphere.', 'حماية عالية جدًا للمناجم. يمكن أن تبقى تحت الجهد في جو الغاز الحارق.'), z: [] },

};

var PROT = {
  d: { icon: 'd', n: L('Flameproof enclosure', 'غلاف مقاوم للّهب'),
    x: L('The housing is strong enough to contain an explosion inside, and its joints cool any flame that escapes, so the gas outside is not ignited.', 'الغلاف قوي بما يكفي لاحتواء أي انفجار داخله، وتبرّد وصلاته أي لهب يخرج منه فلا يشتعل الغاز في الخارج.'),
    m: L('Typical use: motors, switchgear, light fittings and junction boxes. Do not open it while the circuit is live or the area is hazardous.', 'الاستخدام المعتاد: المحركات ولوحات التوزيع وكشافات الإنارة وصناديق التوصيل. لا تفتحه والدائرة تحت الجهد أو المنطقة خطرة.') },
  e: { icon: 'e', n: L('Increased safety', 'أمان مُعزَّز'),

    m: L('Typical use: terminal boxes, motors and lights. Often combined with d, for example Ex db eb: a flameproof main chamber with an increased-safety terminal box.', 'الاستخدام المعتاد: صناديق التوصيل والمحركات والإنارة. يُدمج كثيرًا مع d، مثل Ex db eb: حجرة رئيسية مقاومة للّهب مع صندوق توصيل بأمان مُعزَّز.') },
  i: { icon: 'i', n: L('Intrinsic safety', 'أمان ذاتي'),
    x: L('The circuit carries so little energy that no spark or heat can ignite the gas, even when a fault happens.', 'الدائرة تحمل طاقة ضئيلة جدًا بحيث لا يستطيع أي شرر أو حرارة إشعال الغاز، حتى عند حدوث عطل.'),
    m: L('Typical use: sensors, transmitters and instrument loops. The whole loop, including the barrier and the cable, has to be matched.', 'الاستخدام المعتاد: الحساسات والمرسِلات وحلقات القياس. يجب أن تتوافق الحلقة كلها، بما فيها الحاجز والكابل.') },

    m: L('Newer equipment uses Ex ec or Ex ic instead.', 'المعدات الأحدث تستخدم Ex ec أو Ex ic بدلًا منه.') },
  t: { icon: 't', n: L('Dust protection by enclosure', 'حماية من الغبار بالغلاف'),

  h: { icon: 'h', n: L('Non-electrical protection', 'حماية للمعدات غير الكهربائية'),

    var innerTxt = L('', ''), innerMore = L('', '');
    if (assocInner && EPL[assocInner]) {
      var iz = EPL[assocInner].z;
      innerTxt = L(' The protected circuit is level ' + assocInner + ', so it can lead into ' + (iz.length ? 'Zone ' + iz[0] : 'a mine') + (iz.length > 1 ? ' and the zones below it' : '') + '.', ' الدائرة المحمية بمستوى ' + assocInner + '، فيمكنها الدخول إلى ' + (iz.length ? 'المنطقة ' + iz[0] : 'منجم') + (iz.length > 1 ? ' والمناطق الأقل خطورة' : '') + '.');
    }
    parts.push({ kind: 'assoc', code: '[ ]', title: L('Associated apparatus', 'معدات مرتبطة'), text: L('Brackets around the protection type mean associated apparatus, such as a barrier. It protects intrinsically safe circuits and normally sits in the safe area.' + innerTxt.en, 'الأقواس حول نوع الحماية تعني معدات مرتبطة، مثل الحاجز. وهي تحمي دوائر الأمان الذاتي وتوضع عادة في المنطقة الآمنة.' + innerTxt.ar), more: innerMore, icon: 'assoc' });
  }
  if (assocCat) {
    parts.push({ kind: 'assoc', code: '(' + assocCat + ')', title: L('Circuits that reach Category ' + assocCat, 'دوائر تصل إلى الفئة ' + assocCat), text: L('The number in brackets shows that the circuits of this equipment can connect to Category ' + assocCat + ' equipment, which sits in a more hazardous zone.', 'الرقم بين القوسين يبيّن أن دوائر هذه المعدة يمكن توصيلها بمعدات الفئة ' + assocCat + '، التي تكون في منطقة أشد خطورة.'), more: L('', ''), icon: 'assoc' });
  }
  if (info.ambient) {
    var am = info.ambient;
    parts.push({ kind: 'amb', code: am.min === null ? 'Ta ≤ +' + am.max : am.min + '…+' + am.max + '°C', title: L('Ambient temperature range', 'مدى حرارة المحيط'), text: am.min === null ? L('Rated for ambient temperatures up to +' + am.max + '°C.', 'مصمَّمة لحرارة محيط تصل إلى +' + am.max + '°م.') : L('Rated for ambient temperatures from ' + am.min + '°C to +' + am.max + '°C. Outside this range the protection is not guaranteed.', 'مصمَّمة لحرارة محيط من ' + am.min + '°م إلى +' + am.max + '°م. خارج هذا المدى لا تُضمن الحماية.'), more: L('', ''), icon: 'temp', arg: 'Ta' });
  }

  /* zones */
  var zs = [];
  info.epl.forEach(function (k) { zs = zs.concat(EPL[k].z); });
  if (!zs.length) {
    info.cats.forEach(function (c) {
      var d = c.at.indexOf('D') > -1, g = c.at.indexOf('G') > -1 || !c.at;
      if (c.k === '1') { if (g) zs = zs.concat([0, 1, 2]); if (d) zs = zs.concat([20, 21, 22]); }
      if (c.k === '2') { if (g) zs = zs.concat([1, 2]); if (d) zs = zs.concat([21, 22]); }
      if (c.k === '3') { if (g) zs = zs.concat([2]); if (d) zs = zs.concat([22]); }
    });
  }
  zs = uniq(zs).sort(function (x, y) { return x - y; });
  info.zones = zs;

  /* checks */
  var epRank = {};
  info.epl.forEach(function (k) { var ch = k.charAt(0); epRank[ch] = Math.max(epRank[ch] || 0, RANK[k.charAt(1)]); });
  info.cats.forEach(function (c) {
    var need = { '1': 3, '2': 2, '3': 1, 'M1': 3, 'M2': 2 }[c.k];
    var ats = c.at === 'GD' || c.at === 'DG' ? ['G', 'D'] : (c.at ? [c.at] : (c.k.charAt(0) === 'M' ? ['M'] : []));
    ats.forEach(function (a) {
      if (epRank[a] !== undefined && epRank[a] < need) warnings.push(L('Category ' + c.k + c.at + ' normally needs a higher protection level than the EPL shown. Check the marking against the certificate.', 'الفئة ' + c.k + c.at + ' تتطلب عادة مستوى حماية أعلى من مستوى EPL المذكور. قارن العلامة بالشهادة.'));
    });
    if (c.at === 'G' && info.epl.length && !epRank.G) warnings.push(L('The category says gas (G) but the protection level is for dust. Check the marking.', 'الفئة تشير إلى غاز (G) بينما مستوى الحماية خاص بالغبار. راجع العلامة.'));
    if (c.at === 'D' && info.epl.length && !epRank.D) warnings.push(L('The category says dust (D) but the protection level is for gas. Check the marking.', 'الفئة تشير إلى غبار (D) بينما مستوى الحماية خاص بالغاز. راجع العلامة.'));
  });
  if (info.dust.length && info.prot.some(function (p) { return p.base !== 't' && ['d', 'e', 'i', 'm', 'o', 'p', 'q', 'n'].indexOf(p.base) > -1 && !info.gas.length && !info.epl.some(function (k) { return k.charAt(0) === 'D'; }); })) {

  }
  if (info.gas.length && info.prot.some(function (p) { return p.base === 't'; }) && !info.dust.length) {
    warnings.push(L('Protection type t is for dust, but a gas group was given. Check the marking.', 'نوع الحماية t خاص بالغبار، بينما ذُكرت مجموعة غاز. راجع العلامة.'));
  }
  if (exSeen && info.tempC === null && info.gas.filter(function (x) { return x !== 'I'; }).length) {
    warnings.push(L('No temperature class (T1 to T6) was found in this marking.', 'لم يُعثر على فئة حرارة (T1 إلى T6) في هذه العلامة.'));
  }
  if (!exSeen && !parts.length) { /* nothing recognized at all */ }

  return { parts: parts, info: info, warnings: warnings, unknown: unknown, exSeen: exSeen };
}

function summarize(info) {
  var S = [], at = info.atmos;
  var g = at.G, d = at.D, mm = at.M;
  if (g && d) S.push(L('For gas and dust atmospheres.', 'للأجواء الغازية وأجواء الغبار.'));
  else if (g) S.push(L('For gas and vapor atmospheres.', 'للأجواء الغازية وأبخرة المواد.'));
  else if (d) S.push(L('For combustible dust atmospheres.', 'لأجواء الغبار القابل للاشتعال.'));
  else if (mm) S.push(L('For underground mines (firedamp).', 'للمناجم الجوفية (الغاز الحارق).'));
  if (info.zones.length) {
    var gz = info.zones.filter(function (z) { return z < 10; }), dz = info.zones.filter(function (z) { return z >= 10; });
    var en = [], ar = [];
    if (gz.length) { en.push('Zone ' + joinOr(gz, 'en')); ar.push('المنطقة ' + joinOr(gz, 'ar')); }
    if (dz.length) { en.push('Zone ' + joinOr(dz, 'en')); ar.push('المنطقة ' + joinOr(dz, 'ar')); }
    S.push(L('Suitable for ' + en.join(' and for ') + '.', 'مناسبة لـ' + ar.join(' ولـ') + '.'));
  }
  if (info.gas.length) {
    var order = ['IIA', 'IIB', 'IIB+H2', 'IIC'], best = null;
    info.gas.forEach(function (x) { if (order.indexOf(x) > order.indexOf(best)) best = x; });
    if (best === 'IIC') S.push(L('Covers gas group IIC, so also IIB and IIA.', 'تشمل مجموعة الغاز IIC، وبالتالي IIB وIIA أيضًا.'));
    else if (best === 'IIB') S.push(L('Covers gas group IIB, so also IIA.', 'تشمل مجموعة الغاز IIB، وبالتالي IIA أيضًا.'));
    else if (best === 'IIA') S.push(L('Covers gas group IIA only.', 'تشمل مجموعة الغاز IIA فقط.'));
    else if (best === 'IIB+H2') S.push(L('Covers gas group IIB and hydrogen.', 'تشمل مجموعة الغاز IIB والهيدروجين.'));
  }
  if (info.dust.length) {
    var o2 = ['IIIA', 'IIIB', 'IIIC'], b2 = null;
    info.dust.forEach(function (x) { if (o2.indexOf(x) > o2.indexOf(b2)) b2 = x; });
    if (b2 === 'IIIC') S.push(L('Covers dust group IIIC (conductive), so also IIIB and IIIA.', 'تشمل مجموعة الغبار IIIC (الموصل)، وبالتالي IIIB وIIIA أيضًا.'));
    else if (b2 === 'IIIB') S.push(L('Covers dust group IIIB, so also IIIA.', 'تشمل مجموعة الغبار IIIB، وبالتالي IIIA أيضًا.'));
    else S.push(L('Covers dust group IIIA only.', 'تشمل مجموعة الغبار IIIA فقط.'));
  }
  if (info.tempC !== null) S.push(L('The surface stays at or below ' + info.tempC + '°C.', 'تبقى حرارة السطح عند ' + info.tempC + '°م أو أقل.'));
  if (info.prot.length) {
    var names = [], namesAr = [];
    info.prot.forEach(function (p) { var b = PROT[p.base]; if (b && names.indexOf(b.n.en) < 0) { names.push(b.n.en); namesAr.push(b.n.ar); } });
    S.push(L('Protection: ' + names.join(', ') + '.', 'الحماية: ' + namesAr.join('، ') + '.'));
  }
  if (info.ambient) {
    var am = info.ambient;
    S.push(am.min === null ? L('Ambient up to +' + am.max + '°C.', 'حرارة المحيط حتى +' + am.max + '°م.') : L('Ambient from ' + am.min + '°C to +' + am.max + '°C.', 'حرارة المحيط من ' + am.min + '°م إلى +' + am.max + '°م.'));
  }
  return S;
}

function decodeIP(str) {
  var raw = String(str || '').trim();
  if (!raw) return null;
  var items = [], bad = [];
  raw.split(/[\/,&]|\s+and\s+|\s{2,}/i).forEach(function (seg, idx) {
    var z = seg.trim(); if (!z) return;
    if (idx > 0 && /^[0-6X][0-9X]/i.test(z)) z = 'IP' + z;
    var m = /^IP\s*([0-6Xx])\s*([0-9Xx])(K|k)?\s*([ABCDabcd])?\s*([HMSWhmsw])?$/.exec(z) || /^IP\s*([0-6Xx])\s*([0-9Xx])(K|k)?\s*([ABCDabcd])?\s*([HMSWhmsw])?$/i.exec(z);
    if (!m) { bad.push(z); return; }
    var a = m[1].toUpperCase(), b = m[2].toUpperCase();
    var item = { code: 'IP' + a + b + (m[3] ? 'K' : '') + (m[4] ? m[4].toUpperCase() : '') + (m[5] ? m[5].toUpperCase() : ''), d1: a, d2: b, solid: IP1[a], water: IP2[b], extra: [] };
    if (m[3]) item.extra.push(L('K: high-pressure, high-temperature wash-down test for road vehicles (as in IP69K).', 'K: اختبار غسل بضغط وحرارة عاليين للمركبات على الطرق (كما في IP69K).'));
    if (m[4]) item.extra.push(IPL[m[4].toUpperCase()]);
    if (m[5]) item.extra.push(IPL[m[5].toUpperCase()]);
    items.push(item);
  });
  return { items: items, bad: bad };
}

function decodeCert(str) {
  var raw = String(str || '').trim();
  if (!raw) return null;
  var m, flags = function (f) {
    var o = [];
    if (/X/i.test(f)) o.push({ code: 'X', title: L('Special conditions of use', 'شروط خاصة للاستخدام'), text: L('The certificate lists special conditions for safe use. Read them before installing.', 'تذكر الشهادة شروطًا خاصة للاستخدام الآمن. اقرأها قبل التركيب.') });
    if (/U/i.test(f)) o.push({ code: 'U', title: L('Component certificate', 'شهادة مكوّن'), text: L('It covers a component, not a complete piece of equipment.', 'تغطي مكوّنًا وليس معدة كاملة.') });
    return o;
  };
  var yr = function (y) { var n = parseInt(y, 10); return n >= 90 ? 1900 + n : 2000 + n; };
  m = /^IECEx\s*([A-Za-z]{2,6})\s*(\d{2})\.(\d{3,5})\s*([XUxu]{0,2})$/i.exec(raw);
  if (m) {

      { code: 'IECEx', title: L('IECEx certificate', 'شهادة IECEx'), text: L('An international certificate of conformity from the IECEx scheme.', 'شهادة مطابقة دولية من نظام IECEx.') },
      { code: m[1].toUpperCase(), title: L('Certification body code', 'رمز جهة الاعتماد'), text: L('A short code for the certification body that issued the certificate.', 'رمز مختصر لجهة الاعتماد التي أصدرت الشهادة.') },
      { code: m[2], title: L('Year of issue: ' + yr(m[2]), 'سنة الإصدار: ' + yr(m[2])), text: L('The two digits are the year the certificate was first issued.', 'الرقمان يدلان على سنة الإصدار الأولى للشهادة.') },
      { code: m[3], title: L('Serial number', 'الرقم التسلسلي'), text: L('The number the body gave this certificate in that year.', 'الرقم الذي منحته الجهة لهذه الشهادة في تلك السنة.') }
    ].concat(flags(m[4])) };
  }
  m = /^([A-Za-zÄÖÜäöüß&.\- ]{2,30}?)\s*(\d{2})\s*ATEX\s*([A-Za-z]?)\s*(\d{3,5})\s*([XUxu]{0,2})$/i.exec(raw);
  if (m) {
    var ps = [
      { code: m[1].trim(), title: L('Certification body', 'جهة الاعتماد'), text: L('The name or short name of the body that issued the EU-type examination certificate, exactly as written.', 'اسم الجهة التي أصدرت شهادة فحص النوع الأوروبية أو اسمها المختصر، كما هو مكتوب.') },
      { code: m[2], title: L('Year of issue: ' + yr(m[2]), 'سنة الإصدار: ' + yr(m[2])), text: L('The two digits are the year the certificate was issued.', 'الرقمان يدلان على سنة إصدار الشهادة.') },
      { code: 'ATEX', title: L('ATEX certificate', 'شهادة ATEX'), text: L('Shows it is a certificate under the European ATEX rules.', 'تدل على أنها شهادة وفق قواعد ATEX الأوروبية.') }
    ];
    if (m[3]) ps.push({ code: m[3].toUpperCase(), title: L('Extra letter', 'حرف إضافي'), text: L('Some bodies add a letter to their numbering scheme.', 'بعض الجهات تضيف حرفًا إلى نظام الترقيم لديها.') });
    ps.push({ code: m[4], title: L('Serial number', 'الرقم التسلسلي'), text: L('The number the body gave this certificate.', 'الرقم الذي منحته الجهة لهذه الشهادة.') });
    return { kind: 'ATEX', parts: ps.concat(flags(m[5])) };
  }
  m = /^E\s?(\d{4,7})$/i.exec(raw);
  if (m) return { kind: 'NA', parts: [{ code: 'E' + m[1], title: L('Looks like a UL file number', 'تبدو كرقم ملف UL'), text: L('Numbers that start with E followed by digits are normally UL file numbers.', 'الأرقام التي تبدأ بالحرف E ثم أرقام هي عادة أرقام ملفات UL.') }] };
  m = /^(?:LR|C?LR)\s?-?(\d{3,7})$/i.exec(raw);
  if (m) return { kind: 'NA', parts: [{ code: 'LR ' + m[1], title: L('Looks like a CSA file number', 'تبدو كرقم ملف CSA'), text: L('Numbers that start with LR are normally CSA file numbers.', 'الأرقام التي تبدأ بالرمز LR هي عادة أرقام ملفات CSA.') }] };
  if (/^\d{5,9}$/.test(raw)) return { kind: 'NA', parts: [{ code: raw, title: L('A certificate or file number', 'رقم شهادة أو ملف'), text: L('It is probably a number from a testing laboratory. The digits alone do not say which one.', 'غالبًا هو رقم من مختبر اختبار. الأرقام وحدها لا تحدد أي مختبر.') }] };
  return { kind: 'unknown', parts: [] };
}

/* Lesson screens: Ex Basics, Hazardous Areas, Protection Types, IP Decoder, About */
function L(en, ar) { return { en: en, ar: ar }; }

function card(title, body) { return '<section class="card"><h3>' + T(title) + '</h3>' + body + '</section>'; }

function ulist(items) { return '<ul class="list">' + items.map(function (x) { return '<li>' + IC.ui.check + '<span>' + T(x) + '</span></li>'; }).join('') + '</ul>'; }
function ill(svg) { return '<div class="ill">' + svg + '</div>'; }
function table(head, rows) {

    rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td>' + (typeof c === 'string' ? (i === 0 ? '<span class="chip">' + c + '</span>' : '<span class="ltr">' + c + '</span>') : T(c)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
}

function viewBasics() {

    ill(C.triangle(state.lang)) +
    P(L('An explosion needs three things at the same moment: something that burns (a gas, a vapor or a dust), oxygen from the air, and a source of ignition such as a spark or a hot surface. Remove any one of them and there is no explosion.', 'يحتاج الانفجار إلى ثلاثة أشياء في اللحظة نفسها: مادة تحترق (غاز أو بخار أو غبار)، وأكسجين من الهواء، ومصدر اشتعال مثل شرارة أو سطح ساخن. إذا أزلت واحدًا منها فلا يحدث انفجار.')) +
    P(L('In a refinery or a flour mill you cannot remove the fuel or the air. So explosion-protected (Ex) equipment works on the third side: it makes sure the equipment itself can never be the spark.', 'في معمل تكرير أو مطحنة دقيق لا يمكنك إزالة الوقود ولا الهواء. لذلك تعمل المعدات المحمية من الانفجار (Ex) على الضلع الثالث: تضمن ألا تكون المعدة نفسها هي الشرارة.')));

  h += card(L('Why ordinary equipment is not enough', 'لماذا لا تكفي المعدات العادية'),
    P(L('A motor, a switch, a light fitting or even a mobile phone can make small sparks or get hot. In a normal workshop that does no harm. Next to a gas leak it can be the trigger.', 'المحرك والمفتاح الكهربائي وكشاف الإنارة وحتى الهاتف المحمول قد تُصدر شرارة صغيرة أو تسخن. في ورشة عادية لا ضرر من ذلك، أما بجوار تسرّب غاز فقد تكون هي الشرارة الأولى.')) +
    P(L('Static electricity and plain friction count too. That is why hazardous areas have their own rules for tools, clothing and cables, not only for machines.', 'والكهرباء الساكنة والاحتكاك العادي يُحسبان أيضًا. ولهذا فللمناطق الخطرة قواعدها الخاصة بالأدوات والملابس والكابلات، وليس بالماكينات وحدها.')));

    [C.FLAG_WORLD, L('IECEx', 'IECEx'), L('An international certification scheme. Its markings follow the IEC 60079 standards and start with Ex, as in Ex db IIC T4 Gb. It has no group or category part.', 'نظام اعتماد دولي. تتبع علاماته معايير IEC 60079 وتبدأ بـ Ex كما في Ex db IIC T4 Gb. وليس فيها جزء المجموعة والفئة.')],
    [C.FLAG_NA, L('NEC and CEC', 'NEC وCEC'), L('Used in the USA (National Electrical Code) and Canada (Canadian Electrical Code). The classic style is Class, Division and Group. Newer markings can also use zones, with the AEx or Ex symbol.', 'تُستخدم في أمريكا (الكود الكهربائي الوطني) وكندا (الكود الكهربائي الكندي). الأسلوب التقليدي: الصنف والقسم والمجموعة. وقد تستخدم العلامات الأحدث المناطق أيضًا مع الرمز AEx أو Ex.')]

    '<ol class="list" style="margin-top:12px;counter-reset:n">' + ANAT_ROLE.map(function (r) { return '<li><span class="chip" style="height:fit-content">•</span><span>' + T(r) + '</span></li>'; }).join('') + '</ol>');

    L('Match the gas or dust. The gas group on the equipment must equal or exceed the one in your area. IIC covers IIB and IIA.', 'طابق الغاز أو الغبار. يجب أن تساوي مجموعة الغاز على المعدة المجموعة الموجودة في منطقتك أو تزيد عليها. IIC تغطي IIB وIIA.'),

    L('Check the ambient range and the IP rating against the real site.', 'قارن مدى حرارة المحيط ودرجة IP بظروف الموقع الفعلية.'),
    L('Read the certificate. An X at the end of its number means special conditions of use apply.', 'اقرأ الشهادة. الحرف X في آخر رقمها يعني وجود شروط خاصة للاستخدام.'),

    '<p class="mut" style="margin-top:10px">' + T(L('A higher number is a cooler surface, so T6 is safe with more gases than T1. Dust equipment states the real temperature instead, such as T85°C.', 'الرقم الأعلى يعني سطحًا أبرد، فالفئة T6 آمنة مع غازات أكثر من T1. ومعدات الغبار تذكر الحرارة الفعلية، مثل T85°C.')) + '</p>');

  h += card(L('Which equipment for which zone', 'أي معدة لأي منطقة'),
    table([L('Zone', 'المنطقة'), L('Level', 'المستوى'), L('ATEX category', 'فئة ATEX')], [
      ['0', 'Ga', '1G'], ['1', 'Gb', '2G'], ['2', 'Gc', '3G'],

    ]) + '<p class="mut" style="margin-top:8px">' + T(L('Equipment made for a more hazardous zone can also be used in a less hazardous one, but not the other way round.', 'يمكن استخدام معدة مصنوعة لمنطقة أخطر في منطقة أقل خطورة، لكن العكس غير جائز.')) + '</p>');
  return h;
}

function viewTypes() {

    L('Keep the atmosphere away (p, o, q, m, t). A barrier of air, oil, powder, compound or a dust-tight shell separates the two.', 'أبقِ الجو المتفجر بعيدًا (p وo وq وm وt). يفصل بينهما حاجز من هواء أو زيت أو مسحوق أو مركّب أو غلاف محكم للغبار.'),
    L('Contain the explosion (d). If gas gets in and burns, the housing holds it and cools the flame.', 'احتوِ الانفجار (d). إن دخل الغاز واشتعل يحتفظ الغلاف به ويبرّد اللهب.')

  h += card(L('Two types in one device', 'نوعان في جهاز واحد'),

    P(L('Older equipment may say Ex d where new equipment says Ex db. The idea is the same.', 'قد تكتب المعدات الأقدم Ex d حيث تكتب الحديثة Ex db. والفكرة واحدة.')));
  return h;
}

    L('In North America enclosures often carry a NEMA type, such as 4X, instead of an IP rating. The two do not convert one to one.', 'في أمريكا الشمالية تحمل الأغلفة غالبًا نوع NEMA مثل 4X بدلًا من درجة IP. والاثنان لا يتحوّلان بشكل مباشر.'),

/* Deep explanations for the result screen: why each part matters and what to check */
var DEEP = {
  grp_II: { why: L('Group II is the big family: factories, refineries, tank farms, paint shops, mills and any other place above ground. Group I is only for mines. A group II device must never go underground in a coal mine.', 'المجموعة II هي العائلة الكبيرة: المصانع والمصافي ومستودعات الخزانات وورش الدهان والمطاحن وأي مكان فوق الأرض. أما المجموعة I فهي للمناجم فقط. ولا يجوز إدخال جهاز من المجموعة II إلى منجم فحم.'), check: L('Check that the place really is above ground and not a mine. Then read the gas or dust group later in the marking.', 'تأكد أن المكان فوق الأرض وليس منجمًا. ثم اقرأ مجموعة الغاز أو الغبار لاحقًا في العلامة.') },
  grp_I: { why: L('Mines have two special dangers: firedamp (methane) and coal dust. Group I equipment is built and tested for them, and it also has to survive rough handling underground.', 'في المناجم خطران خاصان: الغاز الحارق (الميثان) وغبار الفحم. ومعدات المجموعة I مصنوعة ومختبرة لهما، ويجب أن تتحمل أيضًا الاستعمال الشاق تحت الأرض.'), check: L('Check the category: M1 keeps working when gas is present, M2 must be switched off when gas appears.', 'تحقق من الفئة: M1 تبقى تعمل عند وجود الغاز، أما M2 فيجب فصلها عند ظهور الغاز.') },
  cat_1: { why: L('Category 1 is the top level. It is made for the place where the explosive atmosphere is there all the time or for long periods, so it must stay safe even if one fault happens and even if two faults happen together.', 'الفئة 1 هي الأعلى. وهي مصنوعة للمكان الذي يوجد فيه الجو المتفجر باستمرار أو لفترات طويلة، فيجب أن تبقى آمنة حتى مع حدوث عطل واحد أو عطلين معًا.'), check: L('Use it for Zone 0 (gas) or Zone 20 (dust). It can also go in the zones with lower risk.', 'استخدمها في المنطقة 0 (غاز) أو المنطقة 20 (غبار). ويمكن أيضًا استخدامها في المناطق الأقل خطورة.') },
  cat_2: { why: L('Category 2 is for places where the explosive atmosphere is likely to appear during normal work. It stays safe even when the usual faults of that equipment happen.', 'الفئة 2 للأماكن التي يُحتمل فيها ظهور الجو المتفجر أثناء العمل العادي. وتبقى آمنة حتى مع الأعطال المعتادة لتلك المعدة.'), check: L('Use it for Zone 1 or Zone 2 (gas), and Zone 21 or Zone 22 (dust).', 'استخدمها في المنطقة 1 أو 2 (غاز)، والمنطقة 21 أو 22 (غبار).') },
  cat_3: { why: L('Category 3 is for places where an explosive atmosphere is not expected, and if it appears it stays only a short time. Safety is needed in normal operation only.', 'الفئة 3 للأماكن التي لا يُتوقع فيها جو متفجر، وإذا ظهر فإنه يبقى لفترة قصيرة. والأمان مطلوب في التشغيل العادي فقط.'), check: L('Use it for Zone 2 (gas) or Zone 22 (dust) only. Never put it in Zone 0, 1, 20 or 21.', 'استخدمها في المنطقة 2 (غاز) أو المنطقة 22 (غبار) فقط. ولا تضعها أبدًا في المناطق 0 أو 1 أو 20 أو 21.') },
  cat_M1: { why: L('M1 equipment must stay running and safe even in firedamp, so it is used for things that cannot be switched off, such as gas detectors and emergency communication.', 'معدات M1 يجب أن تبقى تعمل وآمنة حتى في وجود الغاز الحارق، لذلك تُستخدم لما لا يمكن فصله مثل كواشف الغاز والاتصالات الطارئة.'), check: L('Check that it is used where shutdown is not allowed.', 'تأكد أنها تُستخدم حيث لا يُسمح بالفصل.') },
  cat_M2: { why: L('M2 equipment is switched off when firedamp appears. It is the normal choice for machines and lights in a mine.', 'معدات M2 تُفصل عند ظهور الغاز الحارق. وهي الخيار المعتاد للآلات والإنارة في المناجم.'), check: L('Check that a gas detector will cut the power in time.', 'تأكد أن كاشف الغاز سيقطع الكهرباء في الوقت المناسب.') },
  ex: { why: L('Ex is the sign that a recognised test house has checked the equipment against the explosion-protection standards. Without it the equipment is ordinary equipment, however strong it looks.', 'علامة Ex تدل على أن جهة اختبار معترفًا بها فحصت المعدة وفق معايير الحماية من الانفجار. وبدونها تكون المعدة عادية مهما بدت متينة.'), check: L('The Ex block must be on the nameplate itself and stay readable. A missing or painted-over nameplate means you cannot use the equipment.', 'يجب أن تكون كتلة Ex على لوحة البيانات نفسها وأن تبقى مقروءة. فقدان اللوحة أو طلاؤها يعني أنه لا يمكن استخدام المعدة.') },
  p_d: { why: L('Flameproof: if gas gets inside and explodes, the strong enclosure holds. The hot gas that escapes is cooled while it passes through very narrow gaps, so it cannot light the gas outside.', 'مانع للهب: إذا دخل الغاز وانفجر داخل الغلاف فإن الغلاف القوي يتحمل. أما الغاز الساخن الذي يخرج فيبرد أثناء مروره في فجوات ضيقة جدًا فلا يشعل الغاز الخارجي.'), check: L('Never open it while it is powered. Do not scratch, paint or grease the machined joint faces. Make sure every bolt is there and is the right grade. Use only certified cable glands and stopping plugs. Do not drill extra holes.', 'لا تفتحه وهو تحت الكهرباء. لا تخدش أسطح الوصلات المشغّلة ولا تدهنها. تأكد من وجود كل المسامير ومن أنها بالدرجة الصحيحة. استخدم وصلات كابلات وسدادات معتمدة فقط. ولا تثقب ثقوبًا إضافية.') },
  p_e: { why: L('Increased safety: the equipment has no sparks and no hot spots in normal work, and it adds extra safety on top of the normal design (better insulation, larger distances, secure terminals).', 'السلامة المعززة: لا توجد في المعدة شرارات ولا نقاط ساخنة أثناء العمل العادي، وتضيف أمانًا فوق التصميم المعتاد (عزل أفضل ومسافات أكبر وأطراف مثبتة).'), check: L('Tighten the terminals as the maker says. Never exceed the rated voltage and current. Keep the enclosure closed and its seal in good shape. Use the right cable gland.', 'اربط الأطراف كما يحدد المصنّع. لا تتجاوز الجهد والتيار المقنّنين. أبقِ الغلاف مغلقًا وحشوته سليمة. واستخدم وصلة الكابل الصحيحة.') },
  p_i: { why: L('Intrinsically safe: the energy in the circuit is kept so small that a spark or a hot wire cannot light the gas. It is the only type that allows live work in the hazardous area.', 'الأمان الذاتي: الطاقة في الدائرة صغيرة جدًا فلا تستطيع الشرارة أو السلك الساخن إشعال الغاز. وهو النوع الوحيد الذي يسمح بالعمل على دائرة حية في المنطقة الخطرة.'), check: L('Always check the whole loop, not one device. The voltage, current and power that the barrier can give must be lower than what the device accepts. The capacitance and inductance of the device plus the cable must be lower than what the barrier allows. Keep the barrier earth good.', 'افحص الدائرة كلها لا جهازًا واحدًا. يجب أن يكون الجهد والتيار والقدرة التي يعطيها الحاجز أقل مما يقبله الجهاز. ويجب أن تكون السعة والحث للجهاز مع الكابل أقل مما يسمح به الحاجز. وحافظ على تأريض الحاجز جيدًا.') },
  p_m: { why: L('Encapsulation: the parts that could spark are sealed in a solid compound, so the gas never touches them.', 'التغليف: الأجزاء التي قد تشرر مغلّفة بمادة صلبة فلا يلمسها الغاز.'), check: L('Look for cracks or damage in the compound. It cannot be repaired in the field. A damaged unit must be replaced.', 'ابحث عن شروخ أو تلف في المادة. ولا يمكن إصلاحها في الموقع. والوحدة التالفة تُستبدل.') },
  p_o: { why: L('Oil immersion: the parts that could spark sit under oil, which keeps the gas away from them.', 'الغمر في الزيت: الأجزاء التي قد تشرر تقع تحت الزيت الذي يبعد الغاز عنها.'), check: L('Keep the oil at the marked level and check its condition. Keep the unit upright.', 'أبقِ الزيت عند المستوى المحدد وافحص حالته. وأبقِ الوحدة قائمة.') },
  p_p: { why: L('Pressurised: clean air or inert gas is kept inside the enclosure at a higher pressure than outside, so the explosive gas cannot enter.', 'التضغيط: يُحفظ داخل الغلاف هواء نظيف أو غاز خامل بضغط أعلى من الخارج فلا يدخل الغاز المتفجر.'), check: L('Purge the enclosure for the set time before you switch on. Test the alarm for loss of pressure. Know what the system does when the pressure is lost.', 'نظّف الغلاف بالتهوية للمدة المحددة قبل التشغيل. اختبر إنذار فقدان الضغط. واعرف ما يفعله النظام عند فقدان الضغط.') },
  p_q: { why: L('Powder filling: the parts sit in fine sand or quartz that stops flames and sparks.', 'التعبئة بالمسحوق: الأجزاء تقع في رمل ناعم أو كوارتز يوقف اللهب والشرر.'), check: L('Check that the enclosure is not cracked and the filling has not settled.', 'تأكد أن الغلاف غير مشقوق وأن المسحوق لم يهبط.') },
  p_n: { why: L('Type n (nA, nC, nR) and its newer form ec are for Zone 2 only. The equipment does not make sparks or hot spots in normal work, but it does not have to survive faults like Zone 1 equipment does.', 'النوع n (nA وnC وnR) وصيغته الأحدث ec للمنطقة 2 فقط. فالمعدة لا تصدر شرارات ولا نقاطًا ساخنة في العمل العادي، لكنها لا تلزم بتحمل الأعطال كما تفعل معدات المنطقة 1.'), check: L('Do not use it in Zone 1 or Zone 0. The letter after n tells the method: A no sparks, C sparking parts protected, R restricted breathing.', 'لا تستخدمها في المنطقة 1 أو 0. والحرف بعد n يبيّن الطريقة: A بلا شرر، C أجزاء مشرّرة محمية، R تنفس محدود.') },
  p_t: { why: L('Protection by enclosure for dust: the enclosure keeps dust out and keeps the surface cool, so a dust cloud or a dust layer cannot ignite.', 'الحماية بالغلاف للغبار: الغلاف يمنع دخول الغبار ويُبقي السطح باردًا فلا تشتعل سحابة الغبار أو طبقته.'), check: L('Clean the dust layers regularly. A thick layer on the housing acts like a blanket and makes it hotter. Keep the gaskets and cable entries tight.', 'نظّف طبقات الغبار بانتظام. فالطبقة السميكة على الغلاف تعمل كغطاء وترفع حرارته. وأبقِ الحشوات ومداخل الكابلات محكمة.') },
  p_op: { why: L('Optical radiation: light from lamps, lasers or fibres is limited so it cannot heat a surface or a dust particle enough to ignite it.', 'الإشعاع البصري: الضوء الصادر من المصابيح أو الليزر أو الألياف محدود فلا يستطيع تسخين سطح أو جسيم غبار بما يكفي لإشعاله.'), check: L('The letters after op tell the method: is intrinsically safe, pr protected, sh interlocked. Check that the power of the source is within the certified value.', 'الحروف بعد op تبيّن الطريقة: is أمان ذاتي، pr محمي، sh متشابك. تأكد أن قدرة المصدر ضمن القيمة المعتمدة.') },
  p_s: { why: L('Special protection: a method not covered by the usual list. The certificate explains it, so the nameplate alone is not enough.', 'حماية خاصة: طريقة لا تغطيها القائمة المعتادة. وتشرحها الشهادة، فلا تكفي لوحة البيانات وحدها.'), check: L('Read the certificate and follow every condition in it.', 'اقرأ الشهادة والتزم بكل شرط فيها.') },
  p_h: { why: L('Non-electrical equipment (pumps, gearboxes, brakes) is protected against hot surfaces and sparks from moving parts, friction and static.', 'المعدات غير الكهربائية (المضخات وصناديق التروس والفرامل) محمية من الأسطح الساخنة والشرر الناتج عن الأجزاء المتحركة والاحتكاك والكهرباء الساكنة.'), check: L('Check lubrication and alignment. A dry or worn bearing can become hot.', 'افحص التزييت والمحاذاة. فالمحمل الجاف أو البالي قد يسخن.') },
  gas_IIA: { why: L('IIA gases are the easiest to ignite safely: a larger spark energy is needed. Typical examples are propane, acetone and many solvents.', 'غازات IIA هي الأسهل من حيث الأمان: فهي تحتاج إلى طاقة شرارة أكبر. ومن أمثلتها البروبان والأسيتون وكثير من المذيبات.'), check: L('IIA equipment may only be used with IIA gases. Never with IIB or IIC.', 'معدات IIA تُستخدم مع غازات IIA فقط، ولا تُستخدم مع IIB أو IIC.') },
  gas_IIB: { why: L('IIB gases ignite more easily than IIA. Typical examples are ethylene and town gas.', 'غازات IIB تشتعل أسهل من IIA. ومن أمثلتها الإيثيلين وغاز المدينة.'), check: L('IIB equipment also suits IIA gases, but not IIC.', 'معدات IIB تناسب غازات IIA أيضًا، لكنها لا تناسب IIC.') },
  'gas_IIB+H2': { why: L('This is IIB with extra tests for hydrogen. It is a middle step between IIB and IIC.', 'هذه IIB مع اختبارات إضافية للهيدروجين. وهي خطوة وسط بين IIB وIIC.'), check: L('Good for IIB gases and hydrogen. Acetylene still needs IIC.', 'مناسبة لغازات IIB وللهيدروجين. أما الأسيتيلين فيحتاج IIC.') },
  gas_IIC: { why: L('IIC is the strictest gas group. Hydrogen and acetylene ignite with a very small spark.', 'IIC هي أشد مجموعات الغاز صرامة. فالهيدروجين والأسيتيلين يشتعلان بشرارة صغيرة جدًا.'), check: L('IIC equipment is accepted for every gas group. Use IIC for hydrogen plants, battery rooms and acetylene.', 'معدات IIC مقبولة لكل مجموعات الغاز. استخدم IIC لمحطات الهيدروجين وغرف البطاريات والأسيتيلين.') },
  dust_IIIA: { why: L('IIIA is for combustible flyings, such as cotton fluff, wood chips and fibres.', 'IIIA للألياف القابلة للاشتعال المتطايرة، مثل زغب القطن ونشارة الخشب والألياف.'), check: L('Check the dust of your plant against the group.', 'قارن غبار منشأتك بالمجموعة.') },
  dust_IIIB: { why: L('IIIB is for non-conductive dust, such as flour, sugar, grain and wood dust.', 'IIIB للغبار غير الموصل، مثل الدقيق والسكر والحبوب وغبار الخشب.'), check: L('IIIB equipment also suits IIIA.', 'معدات IIIB تناسب IIIA أيضًا.') },
  dust_IIIC: { why: L('IIIC is for conductive dust, such as metal powders and carbon. Conductive dust inside a device can short circuit it, so the sealing must be very good.', 'IIIC للغبار الموصل، مثل مساحيق المعادن والكربون. والغبار الموصل داخل الجهاز قد يسبب قصرًا كهربائيًا، لذلك يجب أن يكون الإحكام ممتازًا.'), check: L('IIIC equipment suits every dust group.', 'معدات IIIC تناسب كل مجموعات الغبار.') },
  temp: { why: L('The hottest outside surface of the device, in the worst case, stays under this limit. If the gas lights at a lower temperature than the limit, a hot surface alone can start the fire, without any spark.', 'أسخن سطح خارجي للجهاز، في أسوأ حالة، يبقى تحت هذا الحد. وإذا كان الغاز يشتعل عند حرارة أقل من الحد فقد يبدأ الحريق بسطح ساخن وحده دون أي شرارة.'), check: L('Compare the class with the ignition temperature of the gas in your plant. The surface limit must be lower. A T6 device suits all gases that T1 to T5 devices suit. Carbon disulfide (about 90°C) is the usual example that needs T6.', 'قارن الفئة بحرارة اشتعال الغاز في منشأتك. يجب أن يكون حد السطح أقل. والجهاز T6 يناسب كل الغازات التي تناسبها أجهزة T1 إلى T5. وثاني كبريتيد الكربون (نحو 90°م) هو المثال المعتاد الذي يحتاج T6.') },
  temp_dust: { why: L('For dust the limit works on two sides. The surface must stay well under the ignition temperature of a dust cloud (a common rule is two thirds of it, in °C), and also well under the ignition temperature of a dust layer lying on the device (with a safety margin of 75 K for layers up to 5 mm).', 'بالنسبة للغبار فالحد يعمل من جانبين. يجب أن يبقى السطح أقل بكثير من حرارة اشتعال سحابة الغبار (قاعدة شائعة: ثلثاها بالدرجة المئوية)، وأقل بكثير من حرارة اشتعال طبقة الغبار المستقرة على الجهاز (بهامش أمان 75 درجة كلفن للطبقات حتى 5 مم).'), check: L('Get the ignition data of your dust and calculate both limits. Keep the layers thin by cleaning.', 'احصل على بيانات اشتعال غبارك واحسب الحدين. وأبقِ الطبقات رقيقة بالتنظيف.') },
  epl_G: { why: L('EPL is the same message as the category, but written for any standard. Ga is the highest for gas, Gb is high, Gc is enhanced. The letter G means gas.', 'EPL هي رسالة الفئة نفسها لكنها مكتوبة لأي معيار. Ga أعلى مستوى للغاز، وGb مستوى عالٍ، وGc معزز. والحرف G يعني الغاز.'), check: L('Match it to the zone: Ga for Zone 0, Gb for Zone 1, Gc for Zone 2. A higher level may be used in a lower-risk zone, never the opposite.', 'طابقه مع المنطقة: Ga للمنطقة 0، وGb للمنطقة 1، وGc للمنطقة 2. ويجوز استخدام مستوى أعلى في منطقة أقل خطورة، وليس العكس.') },
  epl_D: { why: L('The same idea for dust. Da is the highest, Db is high, Dc is enhanced.', 'الفكرة نفسها للغبار. Da أعلى مستوى، وDb عالٍ، وDc معزز.'), check: L('Match it to the zone: Da for Zone 20, Db for Zone 21, Dc for Zone 22.', 'طابقه مع المنطقة: Da للمنطقة 20، وDb للمنطقة 21، وDc للمنطقة 22.') },
  epl_M: { why: L('The same idea for mines. Ma keeps working in firedamp, Mb is switched off when gas appears.', 'الفكرة نفسها للمناجم. Ma تبقى تعمل في الغاز الحارق، وMb تُفصل عند ظهور الغاز.'), check: L('Check that the cut-off system for Mb works.', 'تأكد أن نظام الفصل للمستوى Mb يعمل.') },
  x: { why: L('The letter X is a warning flag. The certificate has conditions that are not on the nameplate, for example a limit on the ambient temperature, a special cable, or a rule against some cleaning methods.', 'الحرف X علم تحذير. فالشهادة فيها شروط ليست على اللوحة، مثل حد لحرارة المحيط أو كابل خاص أو منع بعض طرق التنظيف.'), check: L('Do not install before you have read the "special conditions" section of the certificate and have followed all of them.', 'لا تركّب قبل أن تقرأ قسم "الشروط الخاصة" في الشهادة وتلتزم بها كلها.') },
  u: { why: L('U means a component, such as a terminal or an empty enclosure. It was not tested as a complete product.', 'U تعني مكوّنًا، مثل طرف توصيل أو غلاف فارغ. ولم يُختبر كمنتج كامل.'), check: L('The finished product made from it needs its own certificate. A component alone cannot be installed in the hazardous area.', 'المنتج النهائي المصنوع منه يحتاج شهادته الخاصة. ولا يمكن تركيب المكوّن وحده في المنطقة الخطرة.') },
  ce: { why: L('CE is the maker\'s declaration. For Ex equipment it means the ATEX rules were followed, including a check of the quality system.', 'CE إعلان من المصنّع. وبالنسبة لمعدات Ex تعني أن قواعد ATEX قد اتُّبعت، ومنها مراجعة نظام الجودة.'), check: L('For Ex equipment the four digits after it identify the body that audits the factory.', 'في معدات Ex تحدد الأرقام الأربعة بعدها الجهة التي تدقق المصنع.') },
  nb: { why: L('This number identifies the notified body (an approved organisation) that audits the quality system of the factory.', 'هذا الرقم يحدد الجهة المبلّغ عنها (منظمة معتمدة) التي تدقق نظام الجودة في المصنع.'), check: L('You can search it in the public list of notified bodies.', 'يمكنك البحث عنه في القائمة العامة للجهات المبلّغ عنها.') },
  assoc: { why: L('Associated apparatus is the partner on the safe side. It limits the energy that goes out to the intrinsically safe circuit. It is not itself made for the hazardous area, unless it also has a second protection type.', 'المعدات المرتبطة هي الشريك في الجانب الآمن. فهي تحدد الطاقة الخارجة إلى دائرة الأمان الذاتي. وهي نفسها ليست مصنوعة للمنطقة الخطرة، إلا إذا كان لها نوع حماية ثانٍ.'), check: L('Install it outside the hazardous area (or in a suitable enclosure) and keep its earth connection.', 'ركّبها خارج المنطقة الخطرة (أو داخل غلاف مناسب) وحافظ على توصيل التأريض.') },
  amb: { why: L('The tests were made inside this ambient range. Outside it the protection is not proven: the enclosure may leak, seals may harden, and surface temperatures may be higher.', 'أُجريت الاختبارات ضمن مدى المحيط هذا. وخارجه لا تثبت الحماية: فقد يتسرب الغلاف وتتصلب الحشوات وترتفع حرارة السطح.'), check: L('Compare the range with the real weather and with heat from nearby sources. When there is no range on the nameplate, the usual range is -20°C to +40°C.', 'قارن المدى بالطقس الفعلي وبالحرارة الصادرة من المصادر القريبة. وعند عدم وجود مدى على اللوحة فالمدى المعتاد هو -20°م إلى +40°م.') },
  class_I: { why: L('Class I covers flammable gases and vapors, such as petrol, natural gas and solvents.', 'الصنف I يغطي الغازات والأبخرة القابلة للاشتعال، مثل البنزين والغاز الطبيعي والمذيبات.'), check: L('Use it for gas plants. Then check the Group (A to D) and the temperature code.', 'استخدمه لمحطات الغاز. ثم تحقق من المجموعة (A إلى D) ورمز الحرارة.') },
  class_II: { why: L('Class II covers combustible dust, such as flour, coal, metal powder and grain.', 'الصنف II يغطي الغبار القابل للاشتعال، مثل الدقيق والفحم ومساحيق المعادن والحبوب.'), check: L('Check the Group (E to G) and the temperature code. Keep dust layers thin.', 'تحقق من المجموعة (E إلى G) ورمز الحرارة. وأبقِ طبقات الغبار رقيقة.') },
  class_III: { why: L('Class III covers fibres and flyings, such as textile fibres and wood chips, which are easy to ignite but do not float in the air in large amounts.', 'الصنف III يغطي الألياف والمواد المتطايرة، مثل ألياف النسيج ونشارة الخشب، وهي سهلة الاشتعال لكنها لا تطفو في الهواء بكميات كبيرة.'), check: L('Class III has no groups. Keep the area clean.', 'الصنف III ليس له مجموعات. وأبقِ المكان نظيفًا.') },
  div_1: { why: L('Division 1: the hazard exists in normal work, or often because of repair or leaks. It is the strictest case.', 'القسم 1: الخطر موجود في العمل العادي، أو كثيرًا بسبب الصيانة أو التسريب. وهي الحالة الأشد صرامة.'), check: L('Use only equipment approved for Division 1. Division 2 equipment is not enough.', 'استخدم معدات معتمدة للقسم 1 فقط. ومعدات القسم 2 لا تكفي.') },
  div_2: { why: L('Division 2: the hazard appears only when something goes wrong, such as a leak or a failed container.', 'القسم 2: يظهر الخطر فقط عند حدوث خلل، مثل تسريب أو عطب في الوعاء.'), check: L('Division 1 equipment may also be used here.', 'يجوز استخدام معدات القسم 1 هنا أيضًا.') },
  zone: { why: L('The zone says how often the explosive atmosphere appears. Lower numbers mean more danger: 0 and 20 are present most of the time, 1 and 21 sometimes in normal work, 2 and 22 rarely and for a short time.', 'تبيّن المنطقة عدد مرات ظهور الجو المتفجر. والأرقام الأقل تعني خطرًا أكبر: 0 و20 موجودة معظم الوقت، و1 و21 أحيانًا في العمل العادي، و2 و22 نادرًا ولمدة قصيرة.'), check: L('The zone is decided by the plant owner in the hazardous area classification, not by the device. Check the equipment level against it.', 'يحدد صاحب المنشأة المنطقة في تصنيف المناطق الخطرة، لا الجهاز. قارن مستوى المعدة بها.') },
  group: { why: L('The group is the family of gases or dusts that the equipment is approved for.', 'المجموعة هي عائلة الغازات أو الأغبرة التي اعتُمدت المعدة لها.'), check: L('Make sure your gas or dust is in the list. A: acetylene. B: hydrogen. C: ethylene. D: propane and petrol. E, F, G: metal, carbon and grain dusts.', 'تأكد أن الغاز أو الغبار عندك ضمن القائمة. A: الأسيتيلين. B: الهيدروجين. C: الإيثيلين. D: البروبان والبنزين. E وF وG: غبار المعادن والكربون والحبوب.') },
  nema: { why: L('The NEMA type describes the enclosure in North America: for example 4X for outdoor and corrosion, 7 for explosion-proof gas places, 9 for dust places.', 'يصف نوع NEMA الغلاف في أمريكا الشمالية: مثلًا 4X للخارج والتآكل، و7 لأماكن الغاز المحمية من الانفجار، و9 لأماكن الغبار.'), check: L('It does not replace the hazardous-area approval. Check both.', 'وهو لا يحل محل اعتماد المناطق الخطرة. تحقق من الاثنين.') }
};

function deepFor(p) {
  var k = p.kind, c = String(p.code || '');
  if (k === 'grp') return DEEP['grp_' + c];
  if (k === 'cat') return DEEP['cat_' + String(p.arg || c.charAt(0)).toUpperCase()];
  if (k === 'prot') { var b = c.toLowerCase().indexOf('op') === 0 ? 'op' : c.charAt(0).toLowerCase(); return DEEP['p_' + b]; }
  if (k === 'gas') return DEEP['gas_' + c];
  if (k === 'dust') return DEEP['dust_' + c];
  if (k === 'temp') return /°C/.test(c) ? DEEP.temp_dust : DEEP.temp;
  if (k === 'epl') return DEEP['epl_' + c.charAt(0)];
  if (k === 'class') return DEEP['class_' + c.replace('Class ', '')];
  if (k === 'div') return DEEP['div_' + c.replace('Div ', '')];
  if (k === 'group') return DEEP.group;
  return DEEP[k] || null;
}

/* "Where it fits": a combined reading of the marking */
function fitHtml(r, sys) {
  var parts = r.parts, h = '';
  var has = function (k) { return parts.filter(function (p) { return p.kind === k; }); };
  var out = [];
  var z = r.zones || [];
  if (z.length) {
    var zl = z.map(function (n) { return '<li><b>' + T(L('Zone ', 'المنطقة ')) + n + '.</b> ' + T(ExEngine.ZONE[n]) + '</li>'; }).join('');
    out.push('<h4>' + T(L('Where you may install it', 'أين يمكنك تركيبها')) + '</h4><ul class="plain">' + zl + '</ul>');
  }
  var gases = has('gas').concat(has('dust')), ex = [];
  gases.forEach(function (p) { var d = DEEP[(p.kind === 'gas' ? 'gas_' : 'dust_') + p.code]; if (d) ex.push('<li><b>' + esc(p.code) + '.</b> ' + T(d.why) + '</li>'); });
  if (ex.length) out.push('<h4>' + T(L('What it can be used with', 'ماذا يمكن استخدامها معه')) + '</h4><ul class="plain">' + ex.join('') + '</ul>');
  var tp = has('temp')[0];
  if (tp) out.push('<h4>' + T(L('The temperature rule', 'قاعدة الحرارة')) + '</h4><p>' + T(deepFor(tp).why) + '</p><p>' + T(deepFor(tp).check) + '</p>');
  var steps = [], seen = {};
  parts.forEach(function (p) {
    if (p.kind === 'prot' || p.kind === 'x' || p.kind === 'u' || p.kind === 'assoc' || p.kind === 'amb') {
      var d = deepFor(p); if (d && d.check && !seen[p.kind + p.code]) { seen[p.kind + p.code] = 1; steps.push('<li><b>' + esc(p.code) + '.</b> ' + T(d.check) + '</li>'); }
    }
  });
  if (steps.length) out.push('<h4>' + T(L('Before and after installation', 'قبل التركيب وبعده')) + '</h4><ul class="plain">' + steps.join('') + '</ul>');
  out.push('<h4>' + T(L('Always remember', 'تذكّر دائمًا')) + '</h4><ul class="plain"><li>' + T(L('The zone is chosen by the plant owner. The device only has to match it.', 'المنطقة يحددها صاحب المنشأة. وعلى الجهاز فقط أن يطابقها.')) + '</li><li>' + T(L('Any change to the device (new gland, drilled hole, paint on the joint, different part) cancels the certificate.', 'أي تعديل على الجهاز (وصلة جديدة أو ثقب أو طلاء على الوصلة أو قطعة مختلفة) يلغي الشهادة.')) + '</li><li>' + T(L('Inspect it on a schedule. Damage, corrosion and missing bolts are the usual reasons for failure.', 'افحصه دوريًا. فالتلف والتآكل وفقد المسامير هي الأسباب المعتادة للأعطال.')) + '</li></ul>');
  return '<section class="card fit"><h3>' + T(L('Where it fits and what to do', 'أين تناسب وماذا تفعل')) + '</h3>' + out.join('') + '</section>';
}

/* The marking read out loud, in order */
function readHtml(r) {
