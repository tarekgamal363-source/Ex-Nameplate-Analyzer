name: Build Android (APK + AAB)

on:
  workflow_dispatch:
    inputs:
      ads_test:
        description: "Test build with Google test ads (for testing only, never upload to Google Play)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PKG: com.ex.nameplate.analyzer
      APP_NAME: Ex Nameplate Analyzer
      # Real AdMob App ID of THIS app: set it in Settings > Secrets and variables > Actions > Variables
      ADMOB_APP_ID: ${{ inputs.ads_test && 'ca-app-pub-3940256099942544~3347511713' || vars.ADMOB_APP_ID }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check requirements
        run: |
          [ -n "$ADMOB_APP_ID" ] || { echo "::error::variable ADMOB_APP_ID is missing (add it under Variables, or run with ads_test)"; exit 1; }
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::secret KEYSTORE_BASE64 is missing"; exit 1; }
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::secret KEYSTORE_PASSWORD is missing"; exit 1; }
          [ -f index.html ] || { echo "::error::index.html not found in repo root"; exit 1; }
          [ -f icon-512.png ] || { echo "::error::icon-512.png not found in repo root"; exit 1; }

      - name: Create Capacitor project
        run: |
          mkdir -p build/www
          cd build
          cat > package.json <<'EOF'
          {
            "name": "ex-nameplate-analyzer-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0",
              "@capacitor-community/admob": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<EOF
          {
            "appId": "$PKG",
            "appName": "$APP_NAME",
            "webDir": "www",
            "backgroundColor": "#0b1b3f",
            "android": { "adjustMarginsForEdgeToEdge": "force" }
          }
          EOF
          npm install --legacy-peer-deps
          cp ../index.html www/
          cp ../*.html www/ 2>/dev/null || true
          cp ../*.png www/ 2>/dev/null || true
          cp ../manifest.json www/ 2>/dev/null || true
          if [ "${{ inputs.ads_test }}" = "true" ]; then
            sed -i "s/const ADMOB_TESTING = false;/const ADMOB_TESTING = true;/" www/index.html
            grep -c "const ADMOB_TESTING = true;" www/index.html
          fi
          npx cap add android

      - name: Patch Android project (manifest, icons, version)
        run: |
          pip install pillow
          cd build/android
          python3 - <<'PY'
          import os, glob
          from PIL import Image
          admob = os.environ["ADMOB_APP_ID"]
          # ----- AndroidManifest: AdMob app id -----
          mp = "app/src/main/AndroidManifest.xml"
          m = open(mp, encoding="utf-8").read()
          meta = f'''
              <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{admob}"/>
          '''
          m = m.replace("</application>", meta + "</application>")
          open(mp, "w", encoding="utf-8").write(m)
          # ----- colors -----
          os.makedirs("app/src/main/res/values", exist_ok=True)
          open("app/src/main/res/values/ic_launcher_background.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#0B1B3F</color></resources>\n')
          # ----- icons -----
          src = Image.open("../www/icon-512.png").convert("RGB")
          bg = (11, 27, 63)
          res = "app/src/main/res"
          for d, sz in {"mdpi":108,"hdpi":162,"xhdpi":216,"xxhdpi":324,"xxxhdpi":432}.items():
              folder = f"{res}/mipmap-{d}"
              if not os.path.isdir(folder): continue
              fg = Image.new("RGBA", (sz, sz), (0, 0, 0, 0))
              inner = int(sz * 0.62)
              fg.paste(src.resize((inner, inner), Image.LANCZOS), ((sz-inner)//2, (sz-inner)//2))
              fg.save(f"{folder}/ic_launcher_foreground.png")
          for d, sz in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              folder = f"{res}/mipmap-{d}"
              if not os.path.isdir(folder): continue
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  src.resize((sz, sz), Image.LANCZOS).save(f"{folder}/{name}")
          # splash screen
          for f in glob.glob(f"{res}/drawable*/splash.png"):
              w, h = Image.open(f).size
              sp = Image.new("RGB", (w, h), bg)
              s = int(min(w, h) * 0.38)
              sp.paste(src.resize((s, s), Image.LANCZOS), ((w-s)//2, (h-s)//2))
              sp.save(f)
          print("patched")
          PY
          # version code increases with every build
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
          # Google Play requires Android 16 (API 36) for new apps
          sed -i -E "s/(compileSdkVersion|targetSdkVersion) = [0-9]+/\1 = 36/" variables.gradle
          sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 24/" variables.gradle
          sed -i -E "/com.android.tools.build:gradle/ s/gradle:[0-9.]+/gradle:8.9.1/" build.gradle
          sed -i -E "s#gradle-[0-9.]+-(bin|all)\.zip#gradle-8.11.1-\1.zip#" gradle/wrapper/gradle-wrapper.properties
          grep -n "SdkVersion" variables.gradle
          grep -n "tools.build" build.gradle
          grep -n "distributionUrl" gradle/wrapper/gradle-wrapper.properties

      - name: Sync + build
        run: |
          cd build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Sign
        run: |
          cd build/android
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          keytool -list -v -keystore upload.jks -storepass "$KEYSTORE_PASSWORD" -alias upload | grep -E "SHA1|SHA256" || true
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks upload.jks --ks-key-alias upload --ks-pass env:KEYSTORE_PASSWORD \
            --out ../../ex-nameplate-analyzer.apk app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../ex-nameplate-analyzer.aab
          jarsigner -keystore upload.jks -storepass "$KEYSTORE_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 ../../ex-nameplate-analyzer.aab upload
          rm upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ads_test && 'ex-nameplate-analyzer-TEST-ADS-do-not-publish' || 'ex-nameplate-analyzer-android' }}
          path: |
            ex-nameplate-analyzer.apk
            ex-nameplate-analyzer.aab
          retention-days: 30
